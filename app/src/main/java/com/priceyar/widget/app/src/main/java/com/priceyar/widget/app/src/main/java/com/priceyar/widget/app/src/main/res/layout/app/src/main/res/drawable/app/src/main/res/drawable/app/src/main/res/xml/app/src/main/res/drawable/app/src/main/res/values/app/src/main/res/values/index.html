<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>مدیریت قیمت فروشگاه</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Arabic","Noto Sans",sans-serif}body{min-height:100vh}.app{max-width:680px;margin:auto;padding:15px 14px 35px}.head{margin-bottom:15px}.storeBox{position:relative;width:100%}.storeBtn{width:100%;height:57px;border-radius:16px;background:#111;color:#fff;border:1px solid #333;font-size:21px;font-weight:800;text-align:center;padding:0 45px;position:relative}.storeBtn:after{content:"⌄";position:absolute;left:18px;top:50%;transform:translateY(-55%);color:#aaa;font-size:22px}.storeMenu{display:none;position:absolute;z-index:20;top:64px;right:0;left:0;background:#151515;border:1px solid #333;border-radius:15px;padding:8px;box-shadow:0 15px 40px #000}.storeMenu.open{display:block}.storeItem{padding:13px;border-radius:10px;font-size:16px;margin-bottom:4px}.storeItem.active{background:#252525}.storeActions{display:flex;gap:8px;margin-top:8px;border-top:1px solid #292929;padding-top:8px}.storeAction{flex:1;height:46px;border-radius:12px;border:1px solid #444;background:#222;color:#fff;font-size:15px;font-weight:800}.storeAction.addStore{background:#fff;color:#000}.storeAction.deleteStore{background:#351010;color:#fff}.searchWrap{position:relative}.search{width:100%;height:58px;background:#151515;border:1px solid #363636;border-radius:16px;color:#fff;font-size:18px;padding:0 52px 0 18px;outline:0}.search:focus{border-color:#666}.searchIcon{position:absolute;right:17px;top:14px;color:#aaa;font-size:25px;pointer-events:none}.quickRow{display:flex;gap:8px;margin-top:10px}.add,.more{flex:1;width:auto;height:51px;margin-top:0;border-radius:14px;font-size:16px;font-weight:800}.add{background:#fff;color:#000;border:0}.more{background:#151515;color:#fff;border:1px solid #333}.more.on{background:#292929;border-color:#666}.section{display:flex;justify-content:space-between;margin:23px 5px 8px}.section span{font-size:12px;color:#777}.row{background:#101010;border:1px solid #252525;border-radius:15px;margin:8px 0;padding:13px 15px;min-height:76px;display:flex;gap:12px;align-items:center}.info{flex:1;min-width:0}.name{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub,.buy{font-size:12px;color:#888;margin-top:4px;line-height:1.7}.price{font-size:21px;font-weight:850;white-space:nowrap}.empty{text-align:center;color:#888;padding:42px 10px}.back{width:100%;height:46px;border-radius:12px;margin-top:10px;color:#aaa;background:#111;border:1px solid #333}.note{text-align:center;color:#666;font-size:11px;margin-top:8px;line-height:1.8}.file{display:none}.modal{display:none;position:fixed;inset:0;background:#000c;align-items:flex-end;z-index:50}.sheet{width:min(680px,100%);background:#111;border:1px solid #333;border-radius:22px 22px 0 0;padding:20px 18px 28px}h2{margin:0 0 12px}.input{width:100%;height:53px;background:#1b1b1b;border:1px solid #444;border-radius:12px;color:#fff;font-size:17px;padding:0 14px;margin:5px 0;outline:0}.textarea{height:82px;padding-top:12px;resize:none}.actions{display:flex;gap:8px;margin-top:9px}.btn{flex:1;height:51px;border:0;border-radius:13px;background:#fff;color:#000;font-weight:800}.dark{background:#252525;color:#fff;border:1px solid #444}.danger{background:#351010;color:#fff}@media(max-width:430px){.app{padding-left:10px;padding-right:10px}.storeBtn{font-size:19px}.add,.more{font-size:14px}.price{font-size:19px}}
</style>
</head>
<body>
<main class="app">
<div class="head"><div class="storeBox"><button class="storeBtn" id="storeBtn"></button><div id="storeMenu" class="storeMenu"></div></div></div>
<div class="searchWrap"><span class="searchIcon">⌕</span><input id="search" class="search" autocomplete="off" placeholder="جستجوی کالا..."></div>
<div class="quickRow"><button class="add" onclick="openAdd()">＋ افزودن کالا</button><button class="more" id="moreBtn" onclick="toggleMore()">اطلاعات ×</button></div>
<div class="section"><b id="title">کالاهای اخیر</b><span id="count"></span></div><div id="list"></div>
<button class="back" onclick="exportStudentFile()">📤 نسخه برای شاگرد</button><button class="back" onclick="backup()">پشتیبان‌گیری از این مغازه</button><button class="back" onclick="file.click()">بازیابی قیمت‌ها</button><input id="file" class="file" type="file" accept=".json" onchange="restore(event)">
<div class="note">اطلاعات این برنامه روی همین دستگاه ذخیره می‌شود. برای فرستادن اطلاعات به شاگرد از «نسخه برای شاگرد» استفاده کن.</div>
</main>
<div id="modal" class="modal"><div class="sheet"><h2 id="mtitle">افزودن کالا</h2><input id="name" class="input" placeholder="نام کالا"><input id="price" class="input" placeholder="قیمت" inputmode="numeric"><input id="buy" class="input" placeholder="قیمت خرید (اختیاری)" inputmode="numeric"><textarea id="desc" class="input textarea" placeholder="توضیحات (اختیاری)"></textarea><div class="actions"><button class="btn" onclick="saveItem()">ذخیره</button><button class="btn dark" onclick="closeModal()">انصراف</button><button id="del" class="btn danger" onclick="deleteItem()">حذف</button></div></div></div>
<script>
const K="priceYarStoresV3";
let data=JSON.parse(localStorage.getItem(K)||"null")||{active:0,stores:[{id:null,name:"سوپر مارکت سلطانی",items:[]}]};
let edit=-1,more=false;
const $=id=>document.getElementById(id); const st=()=>data.stores[data.active];
function nativeLoad(){try{if(window.AndroidBridge){let raw=AndroidBridge.loadData();if(raw){let x=JSON.parse(raw);if(x&&Array.isArray(x.stores)&&x.stores.length){data=x;localStorage.setItem(K,JSON.stringify(data));}}}}catch(e){}}
function makeId(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{let r=Math.random()*16|0,v=c==="x"?r:(r&3|8);return v.toString(16)})}
function ensureIds(){if(!data.stores||!data.stores.length)data={active:0,stores:[{id:makeId(),name:"سوپر مارکت سلطانی",items:[]}]};data.stores.forEach(s=>{if(!s.id)s.id=makeId();if(!Array.isArray(s.items))s.items=[]})}
function save(){ensureIds();let raw=JSON.stringify(data);localStorage.setItem(K,raw);try{if(window.AndroidBridge)AndroidBridge.saveData(raw)}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;",'"':"&#39;"}[m]||""))}
function render(){let q=$("search").value.trim().toLocaleLowerCase();let a=st().items.filter(x=>!q||x.name.toLocaleLowerCase().includes(q)).sort((x,y)=>(y.last||0)-(x.last||0));$("title").textContent=q?"نتایج جستجو":"کالاهای اخیر";$("count").textContent=q?a.length+" نتیجه":st().items.length+" کالا";$("list").innerHTML="";if(!a.length){$("list").innerHTML='<div class="empty">'+(q?"کالایی پیدا نشد":"هنوز کالایی اضافه نشده")+"</div>";return}a.forEach(x=>{let i=st().items.indexOf(x),extra=more?((x.buy?'<div class="buy">قیمت خرید: '+esc(x.buy)+"</div>":"")+(x.desc?'<div class="sub">'+esc(x.desc)+"</div>":"")):"";let r=document.createElement("div");r.className="row";r.innerHTML='<div class="info"><div class="name">'+esc(x.name)+"</div>"+extra+'</div><div class="price">'+esc(x.price)+"</div>";r.onclick=()=>openEdit(i);$("list").appendChild(r)})}
$("storeBtn").onclick=()=>{let m=$("storeMenu");if(m.classList.contains("open"))m.classList.remove("open");else{stores();m.classList.add("open")}};
function stores(){let m=$("storeMenu");m.innerHTML="";data.stores.forEach((s,i)=>{let d=document.createElement("div");d.className="storeItem"+(i===data.active?" active":"");d.textContent=(i===data.active?"✓ ":"")+s.name;d.onclick=()=>{data.active=i;save();m.classList.remove("open");updateStoreButton();render()};m.appendChild(d)});let actions=document.createElement("div");actions.className="storeActions";let add=document.createElement("button");add.className="storeAction addStore";add.textContent="＋ افزودن فروشگاه";add.onclick=()=>{m.classList.remove("open");addStore()};let del=document.createElement("button");del.className="storeAction deleteStore";del.textContent="− حذف فروشگاه";del.onclick=()=>{m.classList.remove("open");deleteStore()};actions.appendChild(add);actions.appendChild(del);m.appendChild(actions)}
function updateStoreButton(){$("storeBtn").textContent=st().name}
function addStore(){let n=prompt("نام فروشگاه جدید را وارد کن:");if(!n||!n.trim())return;data.stores.push({id:makeId(),name:n.trim(),items:[]});data.active=data.stores.length-1;save();updateStoreButton();render()}
function deleteStore(){if(data.stores.length<=1){alert("حداقل یک فروشگاه باید باقی بماند.");return}let name=st().name;if(!confirm("فروشگاه «"+name+"» حذف شود؟\n\nتمام کالاهای این فروشگاه هم حذف می‌شوند."))return;data.stores.splice(data.active,1);if(data.active>=data.stores.length)data.active=data.stores.length-1;save();updateStoreButton();render()}
function toggleMore(){more=!more;$("moreBtn").textContent=more?"اطلاعات ✓":"اطلاعات ×";$("moreBtn").classList.toggle("on",more);render()}
function openAdd(){edit=-1;$("mtitle").textContent="افزودن کالا";["name","price","buy","desc"].forEach(x=>$(x).value="");$("del").style.display="none";$("modal").style.display="flex";setTimeout(()=>$("name").focus(),80)}
function openEdit(i){edit=i;let x=st().items[i];$("mtitle").textContent="ویرایش کالا";$("name").value=x.name;$("price").value=x.price;$("buy").value=x.buy||"";$("desc").value=x.desc||"";$("del").style.display="block";$("modal").style.display="flex"}
function closeModal(){$("modal").style.display="none";render()}
function saveItem(){let n=$("name").value.trim(),p=$("price").value.trim();if(!n||!p){alert("نام و قیمت را وارد کن");return}let x={name:n,price:p,buy:$("buy").value.trim(),desc:$("desc").value.trim(),last:Date.now()};if(edit<0)st().items.push(x);else st().items[edit]=x;save();closeModal()}
function deleteItem(){if(edit>=0&&confirm("این کالا حذف شود؟")){st().items.splice(edit,1);save();closeModal()}}
function backup(){let b=new Blob([JSON.stringify(st(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="backup-"+safeFileName(st().name)+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!Array.isArray(x.items))throw 0;st().items=x.items;save();render();alert("قیمت‌ها بازیابی شدند")}catch(_){alert("فایل پشتیبان معتبر نیست")}};r.readAsText(f);e.target.value=""}
function safeFileName(name){return String(name).replace(/[\\/:*?"<>|]/g,"-").trim()||"store"}
function exportStudentFile(){save();let snapshot=JSON.stringify(data),html=document.documentElement.outerHTML,newKey="priceYarStudent_"+Date.now(),boot='<scr'+'ipt>window.EMBEDDED_DATA='+snapshot+';window.EMBEDDED_KEY='+JSON.stringify(newKey)+';</scr'+'ipt>';html=html.replace("</head>",boot+"</head>");html=html.replace('const K="priceYarStoresV3";','const K=window.EMBEDDED_KEY||"priceYarStoresV3";');html=html.replace('let data=JSON.parse(localStorage.getItem(K)||"null")||{active:0,stores:[{id:null,name:"سوپر مارکت سلطانی",items:[]}]};','let data=JSON.parse(localStorage.getItem(K)||"null")||window.EMBEDDED_DATA||{active:0,stores:[{id:null,name:"سوپر مارکت سلطانی",items:[]}]};');let blob=new Blob(["<!doctype html>\n"+html],{type:"text/html;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="نسخه-"+safeFileName(st().name)+"-"+today()+".html";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);alert("نسخه کامل برای شاگرد ساخته شد.\n\nاین فایل را برای شاگرد ارسال کن.")}
function today(){let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
$("search").addEventListener("input",render);$("search").addEventListener("focus",()=>setTimeout(()=>$("search").scrollIntoView({behavior:"smooth",block:"start"}),250));$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
nativeLoad();ensureIds();save();updateStoreButton();render();
</script>
</body>
</html>
