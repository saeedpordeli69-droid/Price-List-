:root{
--glass-bg:rgba(255,255,255,.075);
--glass-bg-strong:rgba(255,255,255,.105);
--glass-border:rgba(255,255,255,.14);
--glass-border-soft:rgba(255,255,255,.09);
--glass-shadow:0 18px 55px rgba(0,0,0,.38);
--blue:#42b9ff;
--blue2:#6366f1;
--green:#55d98b;
--red:#ff6472;
}

html,body{
background:
radial-gradient(circle at 12% 8%,rgba(48,188,255,.16),transparent 25%),
radial-gradient(circle at 88% 30%,rgba(93,82,255,.14),transparent 28%),
radial-gradient(circle at 45% 92%,rgba(0,174,255,.10),transparent 30%),
#050608;
}

body{
position:relative;
overflow-x:hidden;
font-family:system-ui,-apple-system,"Noto Sans Arabic","Noto Sans",sans-serif;
}

body::before,
body::after{
content:"";
position:fixed;
z-index:0;
pointer-events:none;
border-radius:50%;
filter:blur(65px);
opacity:.55;
}

body::before{
width:190px;
height:190px;
top:7%;
left:-65px;
background:rgba(24,188,255,.34);
}

body::after{
width:230px;
height:230px;
right:-85px;
top:46%;
background:rgba(84,76,255,.25);
}

.app{
position:relative;
z-index:1;
max-width:680px;
padding:20px 14px 42px;
}

.head{
margin-bottom:14px;
}

.storeBox,
.searchWrap,
.quickRow,
.section,
#list,
.app>.back,
.app>.settingsBtn{
position:relative;
}

.storeBtn{
height:68px;
border-radius:22px;
border:1px solid var(--glass-border);
background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.045));
box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.10);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
font-size:22px;
letter-spacing:-.2px;
}

.storeBtn::before{
content:"";
position:absolute;
inset:0;
border-radius:inherit;
background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.08) 48%,transparent 72%);
pointer-events:none;
}

.storeBtn:after{
width:38px;
height:38px;
left:14px;
border-color:rgba(255,255,255,.16);
background:
linear-gradient(#8fdcff,#8fdcff) center 11px/20px 2px no-repeat,
linear-gradient(#8fdcff,#8fdcff) center 21px/13px 2px no-repeat,
rgba(255,255,255,.045);
box-shadow:0 0 20px rgba(66,185,255,.13);
}

.storeMenu{
top:74px;
padding:9px;
border-radius:20px;
background:rgba(18,21,27,.88);
border:1px solid var(--glass-border);
box-shadow:0 25px 70px rgba(0,0,0,.55);
backdrop-filter:blur(25px);
-webkit-backdrop-filter:blur(25px);
}

.storeItem{
border-radius:13px;
padding:13px 14px;
}

.storeItem.active{
background:linear-gradient(135deg,rgba(66,185,255,.18),rgba(99,102,241,.12));
border:1px solid rgba(66,185,255,.16);
}

.storeActions{
border-top-color:var(--glass-border-soft);
}

.storeAction{
background:rgba(255,255,255,.055);
border-color:var(--glass-border);
border-radius:13px;
}

.topTools{
margin-top:9px;
}

.ledgerBtn{
height:42px;
border-radius:14px;
border:1px solid var(--glass-border);
background:rgba(255,255,255,.055);
box-shadow:inset 0 1px 0 rgba(255,255,255,.07);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
}

.ledgerMiniLogo{
color:#7ed4ff;
text-shadow:0 0 16px rgba(66,185,255,.35);
}

.searchWrap{
margin-top:11px;
}

.search{
height:61px;
border-radius:20px;
border:1px solid var(--glass-border);
background:rgba(255,255,255,.065);
box-shadow:var(--glass-shadow),inset 0 1px 0 rgba(255,255,255,.07);
backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);
padding-right:55px;
}

.search:focus{
border-color:rgba(66,185,255,.42);
box-shadow:0 0 0 3px rgba(66,185,255,.08),var(--glass-shadow);
}

.searchIcon{
right:19px;
top:15px;
color:#8fdcff;
text-shadow:0 0 18px rgba(66,185,255,.35);
}

.quickRow{
gap:10px;
margin-top:11px;
}

.add,.more{
height:54px;
border-radius:17px;
background:rgba(255,255,255,.055);
border:1px solid var(--glass-border);
box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
}

.add{
color:#9dddff;
border-color:rgba(66,185,255,.25);
background:linear-gradient(135deg,rgba(66,185,255,.18),rgba(99,102,241,.12));
box-shadow:0 10px 30px rgba(25,145,230,.13),inset 0 1px 0 rgba(255,255,255,.11);
}

.more.on{
color:#9dddff;
border-color:rgba(66,185,255,.45);
background:rgba(66,185,255,.10);
}

.section{
margin:25px 5px 9px;
}

.section b{
font-size:15px;
}

.section span{
color:#7f8a97;
}

#list{
display:flex;
flex-direction:column;
gap:9px;
}

.rowWrap{
margin:0;
}

.row{
min-height:72px;
padding:14px 16px;
border-radius:19px;
border:1px solid var(--glass-border-soft);
background:linear-gradient(135deg,rgba(255,255,255,.085),rgba(255,255,255,.035));
box-shadow:0 12px 34px rgba(0,0,0,.23),inset 0 1px 0 rgba(255,255,255,.06);
backdrop-filter:blur(18px);
-webkit-backdrop-filter:blur(18px);
display:flex;
align-items:center;
justify-content:space-between;
gap:15px;
transition:transform .18s ease,border-color .18s ease,background .18s ease;
}

.row:active{
transform:scale(.985);
border-color:rgba(66,185,255,.28);
background:rgba(66,185,255,.08);
}

.info{
min-width:0;
}

.name{
font-size:18px;
font-weight:850;
line-height:1.45;
}

.price{
flex:0 0 auto;
font-size:20px;
font-weight:900;
color:var(--price-color,#fff);
direction:ltr;
text-align:right;
text-shadow:0 0 16px rgba(255,255,255,.08);
}

.buy,.sub{
margin-top:4px;
font-size:12px;
color:#8f9aa7;
}

.buy{
color:#75d7a0;
}

.longPressHint{
display:none;
}

.empty{
padding:40px 16px;
border-radius:19px;
border:1px dashed rgba(255,255,255,.12);
background:rgba(255,255,255,.035);
color:#7f8a97;
}

.app>.back,
.app>.settingsBtn{
height:52px;
margin-top:10px;
border-radius:17px;
border:1px solid var(--glass-border);
background:rgba(255,255,255,.055);
box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
color:#e8edf2;
font-weight:800;
}

.app>.back:first-of-type{
color:#9dddff;
border-color:rgba(66,185,255,.20);
}

.settingsBtn{
color:#b9c2cc;
}

.modal{
background:rgba(0,0,0,.64);
backdrop-filter:blur(7px);
-webkit-backdrop-filter:blur(7px);
}

.sheet{
border:1px solid var(--glass-border);
border-radius:25px;
background:linear-gradient(145deg,rgba(27,31,39,.91),rgba(10,12,16,.94));
box-shadow:0 30px 100px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.08);
backdrop-filter:blur(28px);
-webkit-backdrop-filter:blur(28px);
}

.input,
.ledgerSearch{
border-color:rgba(255,255,255,.12);
background:rgba(255,255,255,.055);
border-radius:15px;
box-shadow:inset 0 1px 0 rgba(255,255,255,.045);
}

.input:focus,
.ledgerSearch:focus{
border-color:rgba(66,185,255,.40);
box-shadow:0 0 0 3px rgba(66,185,255,.07);
}

.btn,
.dark,
.danger,
.smallBtn,
.ledgerBack,
.settingsClose{
border-radius:14px;
}

.btn{
background:linear-gradient(135deg,#f4f8fb,#cbd5df);
}

.dark,
.smallBtn,
.ledgerBack,
.settingsClose{
background:rgba(255,255,255,.065);
border-color:rgba(255,255,255,.13);
}

.danger{
background:rgba(255,75,92,.13);
border:1px solid rgba(255,100,114,.20);
color:#ff9ba5;
}

.ledgerHeader{
padding-bottom:5px;
}

.ledgerAdd{
border-radius:13px;
background:linear-gradient(135deg,rgba(66,185,255,.18),rgba(99,102,241,.13));
border-color:rgba(66,185,255,.25);
color:#9dddff;
}

.ledgerTabs{
gap:9px;
}

.ledgerTab{
border-radius:15px;
background:rgba(255,255,255,.045);
border-color:rgba(255,255,255,.11);
}

.ledgerTab.active.creditor{
color:#fff;
border-color:#267a4b;
background:#174c30;
box-shadow:0 8px 25px rgba(42,160,91,.12);
}

.ledgerTab.active.debtor{
color:#fff;
border-color:#8a3038;
background:#5b1d24;
box-shadow:0 8px 25px rgba(220,70,84,.12);
}

.ledgerTotal{
border-radius:17px;
background:rgba(255,255,255,.055);
color:#e8edf2;
border-color:rgba(85,217,139,.35);
box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}

.ledgerTotal.debtor{
border-color:rgba(255,100,114,.35);
}

.accountRow,
.txRow,
.summary{
border-radius:17px;
border-color:rgba(255,255,255,.10);
background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.035));
color:#fff;
box-shadow:0 10px 30px rgba(0,0,0,.20),inset 0 1px 0 rgba(255,255,255,.045);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
}

.accountRow{
transition:transform .16s ease,border-color .16s ease;
}

.accountRow:active{
transform:scale(.987);
}

.balance.credit,.totalValue.credit{
color:#63e69b;
}

.balance.debit,.totalValue.debit{
color:#ff7c87;
}

.txAmount.credit{
color:#63e69b;
}

.txAmount.debit{
color:#ff7c87;
}

.settingOption{
border-radius:14px;
background:rgba(255,255,255,.05);
border-color:rgba(255,255,255,.11);
}

.settingOption.active{
border-color:rgba(66,185,255,.50);
background:rgba(66,185,255,.11);
color:#a6e1ff;
}

.modeBadge{
color:#82909e;
}

body.light .add,
body.light .more,

}

body.light .add{

background:linear-gradient(135deg,rgba(66,185,255,.18),rgba(99,102,241,.09));
}

ick="setDigits('fa')">فارسی</button><button id="enDigitsOption" class="settingOption" onclick="setDigits('en')">لاتین</button></div><button class="settingsClose" onclick="closeSettings()">بستن</button></div></div>  <div id="ledgerModal" class="modal"><div class="sheet ledgerSheet sheetScrollFix"><div class="ledgerHeader"><h2><span class="ledgerMiniLogo">▤</span> دفتر حساب</h2></div><div class="ledgerTabs"><button id="creditorTab" class="ledgerTab creditor active" onclick="setLedgerTab('creditor')">طلب</button><button id="debtorTab" class="ledgerTab debtor" onclick="setLedgerTab('debtor')">بدهی</button></div><button id="ledgerAddBtn" class="ledgerAdd" onclick="openAccountForm()">＋ حساب جدید</button><input id="ledgerSearch" class="ledgerSearch" autocomplete="off" placeholder="جستجوی حساب..." oninput="renderAccounts()"><div id="ledgerTotal" class="ledgerTotal"><span id="ledgerTotalTitle">جمع کل طلب‌ها</span><span id="ledgerTotalValue" class="totalValue credit">۰</span></div><div id="accountList"></div></div></div>  <div id="accountModal" class="modal"><div class="sheet sheetScrollFix"><div class="ledgerHeader"><h2 id="accountTitle">حساب</h2></div><div id="accountContent"></div></div></div>  <div id="accountFormModal" class="modal"><div class="sheet sheetScrollFix"><h2 id="accountFormTitle">حساب جدید</h2><div class="settingTitle">نوع حساب</div><div class="settingRow"><button id="accountCreditorBtn" class="settingOption" onclick="setAccountType('creditor')">طلب</button><button id="accountDebtorBtn" class="settingOption" onclick="setAccountType('debtor')">بدهی</button></div><input id="accountName" class="input" placeholder="نام شخص / شرکت"><input id="accountPhone" class="input" placeholder="شماره تماس (اختیاری)" inputmode="tel"><textarea id="accountNote" class="input textarea" placeholder="توضیحات (اختیاری)"></textarea><div class="actions formSave"><button class="btn" onclick="saveAccount()">ذخیره</button><button class="btn dark" onclick="closeAccountForm()">انصراف</button></div></div></div>  <div id="txModal" class="modal"><div class="sheet sheetScrollFix"><h2 id="txTitle">ثبت مبلغ</h2><div class="settingTitle">تاریخ شمسی</div><input id="txDate" class="input" placeholder="۱۴۰۵/۰۷/۱۳" inputmode="numeric" maxlength="10"><button class="smallBtn" style="width:100%;margin:4px 0 8px" onclick="setTodayTxDate()">امروز</button><input id="txAmount" class="input amountInput" placeholder="۱,۲۵۰,۰۰۰" inputmode="numeric"><textarea id="txNote" class="input textarea" placeholder="شرح (اختیاری)"></textarea><div class="actions formSave"><button class="btn" onclick="saveTransaction()">ذخیره</button><button class="btn dark" onclick="closeTx()">انصراف</button></div></div></div>  <script>

function setupLongPress(r,index){let timer=null,moved=false,started=false,longPressed=false,startX=0,startY=0;const stopTimer=()=>{if(timer){clearTimeout(timer);timer=null}};const cancel=()=>{stopTimer();started=false};r.style.touchAction='pan-y';r.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;started=true;moved=false;longPressed=false;startX=e.clientX;startY=e.clientY;stopTimer();timer=setTimeout(()=>{if(started&&!moved){longPressed=true;openDeleteConfirm(index)}stopTimer()},650)});r.addEventListener('pointermove',e=>{if(!started)return;if(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12){moved=true;stopTimer()}});r.addEventListener('pointerup',cancel);r.addEventListener('pointercancel',cancel);r.addEventListener('pointerleave',()=>{if(started)cancel()});r.addEventListener('click',()=>{if(longPressed){longPressed=false;return}if(!moved)openEdit(index);moved=false})}

let ledgerTab="creditor",accountType="creditor";  
function normalizeDigits(v){return String(v??"").replace(/[۰-۹]/g,d=>"0123456789"["۰۱۲۳۴۵۶۷۸۹".indexOf(d)]).replace(/٬/g,",")}  
function accountBalance(a){return (a.transactions||[]).reduce((sum,t)=>sum+(Number(normalizeDigits(t.amount).replace(/[^0-9.-]/g,""))||0),0)}  
function ensureLedger(){if(!Array.isArray(ledger.accounts))ledger.accounts=[];ledger.accounts.forEach(a=>{if(!a.id)a.id=makeId();a.type=a.type==="debtor"?"debtor":"creditor";if(!Array.isArray(a.transactions))a.transactions=[];a.transactions.forEach(t=>{if(!t.id)t.id=makeId();if(!t.date)t.date=jalaliToday();t.amount=formatAmount(t.amount)})})}  
function jalaliToday(){return formatJalali(new Date())}  
function formatJalali(d){let gy=d.getFullYear(),gm=d.getMonth(),gd=d.getDate(),gdm=[31,28,31,30,31,30,31,31,30,31,30,31],gy2=gy-1600,gd2=gd-1,leap=(gy%4===0&&gy%100!==0)||gy%400===0,gdn=365*gy2+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400);for(let i=0;i<gm;i++)gdn+=gdm[i];if(gm>1&&leap)gdn++;gdn+=gd2;let jdn=gdn-79,jnp=Math.floor(jdn/12053);jdn%=12053;let jy=979+33*jnp+4*Math.floor(jdn/1461);jdn%=1461;if(jdn>=366){jy+=Math.floor((jdn-1)/365);jdn=(jdn-1)%365}let jm=jdn<186?1+Math.floor(jdn/31):7+Math.floor((jdn-186)/30),jd=1+(jdn<186?jdn%31:(jdn-186)%30);return String(jy).padStart(4,"0")+"/"+String(jm).padStart(2,"0")+"/"+String(jd).padStart(2,"0")}  
function persianDate(v){let s=String(v||"").trim();if(/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(s)){let p=s.split("/");return faDigits(p[0]+"/"+p[1].padStart(2,"0")+"/"+p[2].padStart(2,"0"))}return faDigits(jalaliToday())}  
function dateKey(v){let s=normalizeDigits(v).replace(/-/g,"/");let p=s.split("/").map(Number);if(p.length===3&&p.every(Number.isFinite))return p[0]*10000+p[1]*100+p[2];return 0}  
function totalForType(type){return ledger.accounts.filter(a=>a.type===type).reduce((sum,a)=>sum+accountBalance(a),0)}
