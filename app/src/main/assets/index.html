<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="مدیریت قیمت">
<link rel="manifest" href="manifest.json">
<title>مدیریت قیمت فروشگاه</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Noto Sans Arabic","Noto Sans",sans-serif}
body{min-height:100vh}
body.light{background:#f5f5f5;color:#111}
.app{max-width:680px;margin:auto;padding:25px 14px 35px}

.head{margin-bottom:15px}
.topTools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}

.ledgerBtn{
 height:44px;padding:0 16px;border-radius:13px;background:#111;color:#fff;
 border:1px solid #333;font-size:14px;font-weight:800;
 display:flex;align-items:center;gap:8px
}
.ledgerLogo{
 width:25px;height:27px;border:1.7px solid #55d98b;border-radius:5px;
 position:relative;display:inline-block
}
.ledgerLogo:before{
 content:"";position:absolute;right:4px;left:4px;top:6px;height:2px;
 background:#55d98b;box-shadow:0 6px 0 #55d98b,0 12px 0 #55d98b
}
.ledgerLogo:after{
 content:"";position:absolute;right:-3px;bottom:3px;width:9px;height:9px;
 border-radius:50%;background:#111;border:1.5px solid #55d98b
}

.storeBox{position:relative;width:100%}
.storeBtn{
 width:100%;height:57px;border-radius:16px;background:#111;color:#fff;
 border:1px solid #333;font-size:23px;font-weight:850;text-align:center;
 padding:5px 55px 0;position:relative
}
.storeBtn:after{
 content:"";position:absolute;left:10px;top:50%;width:36px;height:36px;
 transform:translateY(-50%);border-radius:50%;border:1px solid rgba(255,255,255,.12);
 background:linear-gradient(#aaa,#aaa) center 11px/20px 2px no-repeat,
 linear-gradient(#aaa,#aaa) center 21px/13px 2px no-repeat,rgba(255,255,255,.035)
}
.storeBtn.emptyStore{color:#aaa}

.storeMenu{
 display:none;position:absolute;z-index:20;top:64px;right:0;left:0;background:#151515;
 border:1px solid #333;border-radius:15px;padding:8px;box-shadow:0 15px 40px #000
}
.storeMenu.open{display:block}
.storeItem{padding:13px;border-radius:10px;font-size:16px;margin-bottom:4px}
.storeItem.active{background:#252525}
.storeActions{display:flex;gap:8px;margin-top:8px;border-top:1px solid #292929;padding-top:8px}
.storeAction{
 flex:1;height:46px;border-radius:12px;border:1px solid #444;
 background:#351010;color:#fff;font-size:15px;font-weight:800
}

.searchWrap{position:relative}
.search{
 width:100%;height:58px;background:#151515;border:1px solid #363636;border-radius:16px;
 color:#fff;font-size:18px;padding:0 52px 0 18px;outline:0
}
.searchIcon{position:absolute;right:17px;top:14px;color:#aaa;font-size:25px;pointer-events:none}

.quickRow{display:flex;gap:8px;margin-top:10px}
.add,.more{flex:1;height:51px;border-radius:14px;font-size:16px;font-weight:800}
.add{background:#000;color:#64B4FF;border:1px solid #333}
.more{background:#000;color:#E8EAED;border:1px solid #333}
.more.on{border-color:#64B4FF;color:#64B4FF}

.section{display:flex;justify-content:space-between;margin:23px 5px 8px}
.section span{font-size:12px;color:#777}

.row{
 position:relative;background:#101010;border:1px solid #252525;border-radius:15px;
 padding:13px 15px;min-height:76px;display:flex;gap:12px;align-items:center;
 user-select:none;transition:background .15s
}
.row.longPress{background:#171717;border-color:#555}
.info{flex:1;min-width:0}
.name{font-size:21px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub,.buy{font-size:12px;color:#888;margin-top:4px;line-height:1.7}
.price{font-size:21px;font-weight:850;white-space:nowrap}
.empty{text-align:center;color:#888;padding:42px 10px}

.itemDelete{
 display:none;position:absolute;left:10px;top:50%;transform:translateY(-50%);
 height:38px;padding:0 13px;border-radius:10px;background:#b00000;color:#fff;
 border:1px solid #e22;font-weight:800;z-index:3
}
.row.longPress .itemDelete{display:block}

.back,.settingsBtn{
 width:100%;height:46px;border-radius:12px;margin-top:10px;color:#fff;
 background:#111;border:1px solid #333
}
.settingsBtn{font-size:15px;font-weight:800}
.file{display:none}

.modal{
 display:none;position:fixed;inset:0;background:#000c;align-items:flex-end;z-index:50
}
.sheet{
 width:min(680px,100%);max-height:92vh;overflow:auto;background:#111;
 border:1px solid #333;border-radius:22px 22px 0 0;padding:20px 18px 28px
}
h2{margin:0 0 12px}

.input{
 width:100%;height:53px;background:#1b1b1b;border:1px solid #444;border-radius:12px;
 color:#fff;font-size:17px;padding:0 14px;margin:5px 0;outline:0
}
.textarea{height:82px;padding-top:12px;resize:none}
.actions{display:flex;gap:8px;margin-top:9px}
.btn{flex:1;height:51px;border:0;border-radius:13px;background:#fff;color:#000;font-weight:800}
.dark{background:#252525;color:#fff;border:1px solid #444}
.danger{background:#351010;color:#fff}

.modeBadge{text-align:center;font-size:11px;color:#777}
.modeBadge.seller{color:#aaa}

.settingTitle{font-size:13px;color:#888;margin:17px 2px 8px}
.settingRow{display:flex;gap:8px;flex-wrap:wrap}
.settingOption{
 flex:1;min-width:90px;height:44px;border-radius:11px;background:#181818;
 border:1px solid #333;color:#fff;font-size:14px;font-weight:700
}
.settingOption.active{border-color:#aaa;background:#292929}
.colorOption{height:38px;min-width:55px}
.colorWhite{color:#fff}
.colorBlue{color:#64B4FF}
.colorGreen{color:#55d98b}
.colorYellow{color:#ffd75a}
.colorRed{color:#ff6b6b}

.settingsClose{
 margin-top:18px;width:100%;height:48px;border-radius:12px;border:1px solid #444;
 background:#252525;color:#fff;font-weight:800
}

.ledgerHeader{
 display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px
}
.ledgerHeader h2{margin:0}
.ledgerAdd{
 height:43px;border-radius:11px;border:1px solid #444;background:#351010;
 color:#fff;padding:0 14px;font-weight:800
}

.ledgerTabs{display:flex;gap:8px;margin-bottom:12px}
.ledgerTab{
 flex:1;height:49px;border-radius:13px;border:1px solid #444;
 background:#181818;color:#aaa;font-size:16px;font-weight:850
}
.ledgerTab.active.creditor{color:#55d98b;border-color:#55d98b;background:#102219}
.ledgerTab.active.debtor{color:#ff6b6b;border-color:#ff6b6b;background:#241111}

.ledgerSearch{
 width:100%;height:50px;background:#181818;border:1px solid #333;
 border-radius:12px;color:#fff;font-size:16px;padding:0 14px;outline:0;margin-bottom:8px
}

.totalBox{
 border-radius:14px;padding:15px;margin:8px 0 12px;
 display:flex;justify-content:space-between;align-items:center;
 font-weight:850
}
.totalBox.creditor{background:#102219;border:1px solid #55d98b;color:#55d98b}
.totalBox.debtor{background:#241111;border:1px solid #ff6b6b;color:#ff6b6b}
.totalNumber{font-size:20px}

.accountRow{
 padding:14px;border:1px solid #292929;border-radius:14px;background:#151515;
 margin:8px 0;display:flex;align-items:center;justify-content:space-between;gap:10px
}
.accountName{font-size:17px;font-weight:850}
.accountMeta{font-size:12px;color:#888;margin-top:4px}
.balance{font-weight:850;white-space:nowrap}
.balance.credit{color:#55d98b}
.balance.debit{color:#ff6b6b}

.accountTypeLabel{font-size:12px;margin-top:4px}
.accountTypeLabel.creditor{color:#55d98b}
.accountTypeLabel.debtor{color:#ff6b6b}

.accountActions{display:flex;gap:7px;margin-top:12px}
.smallBtn{
 height:42px;flex:1;border-radius:11px;border:1px solid #444;
 background:#252525;color:#fff;font-weight:800
}
.smallBtn.danger{background:#351010}

.txRow{
 padding:12px;border:1px solid #292929;border-radius:13px;
 background:#151515;margin:7px 0
}
.txTop{display:flex;justify-content:space-between;gap:8px}
.txAmount{font-weight:850}
.txDate{font-size:12px;color:#888;margin-top:4px}
.txNote{font-size:12px;color:#888;margin-top:5px}
.txActions{display:flex;gap:6px;margin-top:8px}
.txActions button{
 flex:1;height:35px;border-radius:9px;border:1px solid #444;
 background:#222;color:#fff
}

.accountBack{
 width:100%;height:45px;border-radius:11px;background:#252525;
 color:#fff;border:1px solid #444;margin-top:10px;font-weight:800
}

.summary{
 padding:13px;border:1px solid #292929;border-radius:14px;
 background:#151515;margin:8px 0
}
.summaryLine{display:flex;justify-content:space-between;margin:5px 0}
.summaryLine strong{font-weight:850}

.typeChoice{display:flex;gap:8px}
.typeChoice button{
 flex:1;height:46px;border-radius:11px;background:#181818;
 border:1px solid #444;color:#aaa;font-weight:800
}
.typeChoice button.active.creditor{border-color:#55d98b;color:#55d98b;background:#102219}
.typeChoice button.active.debtor{border-color:#ff6b6b;color:#ff6b6b;background:#241111}

body.light .storeBtn,
body.light .search,
body.light .row,
body.light .back,
body.light .settingsBtn,
body.light .add,
body.light .more,
body.light .ledgerBtn{background:#fff;color:#111;border-color:#ddd}
body.light .storeMenu{background:#fff;border-color:#ddd;box-shadow:0 15px 40px #0002}
body.light .storeItem.active{background:#eee}
body.light .storeActions{border-top-color:#ddd}
body.light .sheet{background:#fff;color:#111;border-color:#ddd}
body.light .input{background:#f5f5f5;color:#111;border-color:#ccc}
body.light .dark,
body.light .accountBack,
body.light .smallBtn{background:#eee;color:#111;border-color:#ccc}
body.light .settingOption{background:#f5f5f5;color:#111;border-color:#ddd}
body.light .settingOption.active{background:#e5e5e5;border-color:#999}
body.light .settingsClose{background:#eee;color:#111;border-color:#ccc}
body.light .accountRow,
body.light .txRow,
body.light .summary{background:#f8f8f8;border-color:#ddd}
body.light .ledgerSearch{background:#f5f5f5;color:#111;border-color:#ddd}
body.light .ledgerTab{background:#f5f5f5;color:#777}
body.light .storeBtn:after{
 border-color:rgba(0,0,0,.12);
 background:linear-gradient(#555,#555) center 11px/20px 2px no-repeat,
 linear-gradient(#555,#555) center 21px/13px 2px no-repeat,rgba(0,0,0,.035)
}

@media(max-width:430px){
 .app{padding-left:10px;padding-right:10px;padding-top:25px}
 .storeBtn{font-size:21px}
 .add,.more{font-size:14px}
 .name,.price{font-size:20px}
}
</style>
</head>

<body>
<main class="app">

<div class="head">
 <div class="storeBox">
  <button class="storeBtn emptyStore" id="storeBtn"></button>
  <div id="storeMenu" class="storeMenu"></div>
 </div>

 <div class="topTools">
  <button class="ledgerBtn" onclick="openLedger()">
   <span class="ledgerLogo"></span>
   <span>دفتر حساب</span>
  </button>
  <div id="modeBadge" class="modeBadge"></div>
 </div>
</div>

<div class="searchWrap">
 <span class="searchIcon">⌕</span>
 <input id="search" class="search" autocomplete="off" placeholder="جستجوی کالا...">
</div>

<div class="quickRow">
 <button class="add" onclick="openAdd()">＋ افزودن کالا</button>
 <button class="more" id="moreBtn" onclick="toggleMore()">اطلاعات ○</button>
</div>

<div class="section">
 <b id="title">کالاهای اخیر</b>
 <span id="count"></span>
</div>

<div id="list"></div>

<button class="back" onclick="exportPriceList()">➤ ارسال لیست</button>
<button class="back" onclick="updatePriceList()">↻ به‌روزرسانی لیست</button>
<button class="settingsBtn" onclick="openSettings()">⚙ تنظیمات</button>

<input id="updateFile" class="file" type="file" accept=".json,application/json"
 onchange="importPriceList(event)">

</main>


<!-- کالا -->
<div id="modal" class="modal">
 <div class="sheet">
  <h2 id="mtitle">افزودن کالا</h2>

  <input id="name" class="input" placeholder="نام کالا">
  <input id="price" class="input" placeholder="قیمت" inputmode="numeric">

  <div id="buyWrap">
   <input id="buy" class="input" placeholder="قیمت خرید (اختیاری)" inputmode="numeric">
  </div>

  <textarea id="desc" class="input textarea"
   placeholder="توضیحات (اختیاری)"></textarea>

  <div class="actions">
   <button class="btn" onclick="saveItem()">ذخیره</button>
   <button class="btn dark" onclick="closeModal()">انصراف</button>
  </div>
 </div>
</div>


<!-- تنظیمات -->
<div id="settingsModal" class="modal">
 <div class="sheet">
  <h2>تنظیمات</h2>

  <div class="settingTitle">حالت نمایش</div>
  <div class="settingRow">
   <button id="darkOption" class="settingOption"
    onclick="setTheme('dark')">تیره</button>
   <button id="lightOption" class="settingOption"
    onclick="setTheme('light')">روشن</button>
  </div>

  <div class="settingTitle">رنگ قیمت‌ها</div>
  <div class="settingRow">
   <button class="settingOption colorOption colorWhite"
    onclick="setPriceColor('#fff')">سفید</button>
   <button class="settingOption colorOption colorBlue"
    onclick="setPriceColor('#64B4FF')">آبی</button>
   <button class="settingOption colorOption colorGreen"
    onclick="setPriceColor('#55d98b')">سبز</button>
   <button class="settingOption colorOption colorYellow"
    onclick="setPriceColor('#ffd75a')">زرد</button>
   <button class="settingOption colorOption colorRed"
    onclick="setPriceColor('#ff6b6b')">قرمز</button>
  </div>

  <div class="settingTitle">نمایش اعداد</div>
  <div class="settingRow">
   <button id="faDigitsOption" class="settingOption"
    onclick="setDigits('fa')">فارسی</button>
   <button id="enDigitsOption" class="settingOption"
    onclick="setDigits('en')">لاتین</button>
  </div>
 </div>
</div>


<!-- دفتر حساب -->
<div id="ledgerModal" class="modal">
 <div class="sheet">

  <div class="ledgerHeader">
   <h2>دفتر حساب</h2>
   <button id="ledgerAddBtn" class="ledgerAdd"
    onclick="openAccountForm()">＋ حساب جدید</button>
  </div>

  <div class="ledgerTabs">
   <button id="creditorTab" class="ledgerTab creditor"
    onclick="setLedgerFilter('creditor')">طلب</button>
   <button id="debtorTab" class="ledgerTab debtor"
    onclick="setLedgerFilter('debtor')">بدهی</button>
  </div>

  <input id="ledgerSearch" class="ledgerSearch"
   placeholder="جستجوی حساب..." autocomplete="off">

  <div id="ledgerTotal"></div>
  <div id="accountList"></div>

 </div>
</div>


<!-- جزئیات حساب -->
<div id="accountModal" class="modal">
 <div class="sheet">
  <h2 id="accountTitle">حساب</h2>
  <div id="accountContent"></div>
 </div>
</div>


<!-- ساخت/ویرایش حساب -->
<div id="accountFormModal" class="modal">
 <div class="sheet">

  <h2 id="accountFormTitle">حساب جدید</h2>

  <input id="accountName" class="input"
   placeholder="نام شخص / مشتری / شرکت">

  <input id="accountPhone" class="input"
   placeholder="شماره تماس (اختیاری)" inputmode="tel">

  <div class="settingTitle">نوع حساب</div>

  <div class="typeChoice">
   <button id="creditorTypeBtn" onclick="setAccountType('creditor')">
    طلب
   </button>
   <button id="debtorTypeBtn" onclick="setAccountType('debtor')">
    بدهی
   </button>
  </div>

  <textarea id="accountNote" class="input textarea"
   placeholder="توضیحات (اختیاری)"></textarea>

  <div class="actions">
   <button class="btn" onclick="saveAccount()">ذخیره</button>
  </div>

 </div>
</div>


<!-- تراکنش -->
<div id="txModal" class="modal">
 <div class="sheet">

  <h2 id="txTitle">ثبت مبلغ</h2>

  <div class="settingTitle">مبلغ</div>
  <input id="txAmount" class="input"
   placeholder="مبلغ" inputmode="numeric">

  <div class="settingTitle">تاریخ</div>
  <input id="txDate" class="input" type="date">

  <textarea id="txNote" class="input textarea"
   placeholder="شرح (اختیاری)"></textarea>

  <div class="actions">
   <button class="btn" onclick="saveTransaction()">ذخیره</button>
  </div>

 </div>
</div>


<script>
const K="priceYarStoresV3";
const MODE_KEY="priceYarAppMode";
const SETTINGS_KEY="priceYarSettingsV1";
const LEDGER_KEY="priceYarLedgerV2";

let data=JSON.parse(localStorage.getItem(K)||"null")||
 {active:-1,stores:[],deleted:{}};

let appMode=localStorage.getItem(MODE_KEY)||"management";

let settings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"null")||
 {theme:"dark",priceColor:"#fff",digits:"fa"};

let ledger=JSON.parse(localStorage.getItem(LEDGER_KEY)||"null")||
 {accounts:[]};

let edit=-1;
let more=false;
let accountEdit=-1;
let activeAccount=-1;
let txEdit=-1;
let accountType="creditor";
let ledgerFilter="creditor";
let longPressTimer=null;
let longPressTriggered=false;
let historyDepth=0;

const $=id=>document.getElementById(id);
const st=()=>data.stores[data.active];

function makeId(){
 return window.crypto&&crypto.randomUUID?
 crypto.randomUUID():
 "id-"+Date.now()+"-"+Math.random().toString(36).slice(2);
}

function normalizeName(n){
 return String(n||"").trim().replace(/\s+/g," ").toLocaleLowerCase();
}

function isSeller(){
 return appMode==="seller";
}

function faDigits(v){
 let t=String(v??"");
 return settings.digits==="en"
 ?t
 :t.replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
}

function esc(s){
 return String(s??"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[m]));
}

function parseAmount(v){
 let s=String(v??"")
 .replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
 .replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
 .replace(/[,\u066C]/g,"")
 .replace(/[^\d.-]/g,"");
 return Number(s)||0;
}

function formatAmount(n){
 return faDigits(Math.round(Number(n)||0).toLocaleString("en-US"));
}

function today(){
 let d=new Date();
 return d.toISOString().slice(0,10);
}

function showDate(d){
 if(!d)return "";
 try{
  return new Date(d+"T00:00:00").toLocaleDateString(
   "fa-IR-u-ca-persian",
   {year:"numeric",month:"2-digit",day:"2-digit"}
  );
 }catch(e){
  return d;
 }
}

function ensureIds(){
 if(!Array.isArray(data.stores))data.stores=[];
 data.stores.forEach(s=>{
  if(!s.id)s.id=makeId();
  if(!Array.isArray(s.items))s.items=[];
 });
 if(!data.stores.length)data.active=-1;
 else if(data.active<0||data.active>=data.stores.length)data.active=0;
}

function ensureItemIds(){
 data.stores.forEach(s=>(s.items||[]).forEach(x=>{
  if(!x.id)x.id=makeId();
  if(!x.last)x.last=Date.now();
 }));
 if(!data.deleted)data.deleted={};
}

function cleanSellerData(){
 if(!isSeller())return;
 data.stores.forEach(s=>(s.items||[]).forEach(x=>{
  delete x.buy;
  delete x.buyPrice;
  delete x.purchasePrice;
 }));
}

function save(){
 ensureIds();
 ensureItemIds();
 if(isSeller())cleanSellerData();

 localStorage.setItem(K,JSON.stringify(data));

 if(window.AndroidBridge&&AndroidBridge.saveData){
  try{AndroidBridge.saveData(JSON.stringify(data))}catch(e){}
 }
}

function saveLedger(){
 localStorage.setItem(LEDGER_KEY,JSON.stringify(ledger));
}

function setMode(m){
 appMode=m==="seller"?"seller":"management";
 localStorage.setItem(MODE_KEY,appMode);
 applyMode();
}

function applyMode(){
 $("buyWrap").style.display=isSeller()?"none":"block";
 $("modeBadge").textContent=isSeller()?"حالت فروشندگان":"حالت مدیریت";
 $("modeBadge").classList.toggle("seller",isSeller());
 $("moreBtn").textContent=more?"اطلاعات ✓":"اطلاعات ○";
 applySettings();
 render();
}

function applySettings(){
 document.body.classList.toggle("light",settings.theme==="light");

 if($("darkOption"))
  $("darkOption").classList.toggle("active",settings.theme==="dark");

 if($("lightOption"))
  $("lightOption").classList.toggle("active",settings.theme==="light");

 if($("faDigitsOption"))
  $("faDigitsOption").classList.toggle("active",settings.digits==="fa");

 if($("enDigitsOption"))
  $("enDigitsOption").classList.toggle("active",settings.digits==="en");

 document.querySelectorAll(".price").forEach(e=>{
  e.style.color=settings.priceColor;
 });
}

function saveSettings(){
 localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));
 applySettings();
}

function setTheme(x){
 settings.theme=x==="light"?"light":"dark";
 saveSettings();
}

function setPriceColor(x){
 settings.priceColor=x;
 saveSettings();
}

function setDigits(x){
 settings.digits=x==="en"?"en":"fa";
 saveSettings();
 render();
}

function openSettings(){

/* نگه داشتن کالا */

function setupLongPress(row,index){

 let timer=null;
 let moved=false;

 function start(e){
  if(e.target.closest(".itemDelete"))return;

  moved=false;

  timer=setTimeout(()=>{
   longPressTriggered=true;
   row.classList.add("longPress");
   if(navigator.vibrate)navigator.vibrate(35);
  },600);
 }

 function move(){
  moved=true;
  clearTimeout(timer);
 }

 function end(){
  clearTimeout(timer);
 }

 row.addEventListener("pointerdown",start);
 row.addEventListener("pointermove",move);
 row.addEventListener("pointerup",end);
 row.addEventListener("pointercancel",end);

 row.addEventListener("click",function(e){
  if(e.target.closest(".itemDelete"))return;

  if(longPressTriggered){
   longPressTriggered=false;
   return;
  }

  if(row.classList.contains("longPress")){
   row.classList.remove("longPress");
   return;
  }

  openEdit(index);
 });
}

function deleteItemDirect(e,i){

 st().items.splice(i,1);

}

/* ---------------- ارسال و ورود لیست ---------------- */

function exportPriceList(){

 if(!st()){
  alert("ابتدا یک فروشگاه انتخاب کنید.");
  return;
 }

 ensureIds();
 ensureItemIds();
 ensureLedger();

 let accounts=ledger.accounts
 .filter(a=>!isSeller()||a.type==="creditor")
 .map(a=>JSON.parse(JSON.stringify(a)));

 let p={
  type:"priceyar-price-list",
  version:3,
  createdAt:Date.now(),
  shareMode:isSeller()?"seller":"management",
  stores:[JSON.parse(JSON.stringify(st()))],
  deleted:{},
  ledger:{
   version:1,
   shareMode:isSeller()?"seller":"management",
   accounts:accounts
  }
 };

 let j=JSON.stringify(p,null,2);
 let fn="لیست جدید قیمت‌ها - برای به‌روزرسانی لمس کنید.json";

 if(window.AndroidBridge?.sharePriceList)
  try{return AndroidBridge.sharePriceList(j,fn)}catch(e){}

 if(window.AndroidBridge?.exportPriceList)
  try{return AndroidBridge.exportPriceList(j,fn)}catch(e){}

 try{
  let a=document.createElement("a");
  let u=URL.createObjectURL(
   new Blob([j],{type:"application/json;charset=utf-8"})
  );

  a.href=u;
  a.download=fn;
  a.click();

  setTimeout(()=>URL.revokeObjectURL(u),2000);
 }catch(e){
  alert("امکان ساخت فایل وجود ندارد.");
 }
}

function updatePriceList(){
 if(window.AndroidBridge?.importPriceList)
  try{return AndroidBridge.importPriceList()}catch(e){}

 $("updateFile").value="";
 $("updateFile").click();
}

window.receiveImportedPriceList=function(text){

 try{

  let incoming=JSON.parse(text);

  if(!incoming||
     incoming.type!=="priceyar-price-list"||
     !Array.isArray(incoming.stores))
   throw 0;

  let seller=incoming.shareMode==="seller";

  if(incoming.shareMode!=="seller"&&
     incoming.shareMode!=="management"){

   let all=incoming.stores.flatMap(
    s=>Array.isArray(s.items)?s.items:[]
   );

   seller=all.length>0&&
    all.every(x=>
     !Object.prototype.hasOwnProperty.call(x,"buy")
    );
  }

  setMode(seller?"seller":"management");

  let first=null;

  incoming.stores.forEach(ins=>{

   if(!ins)return;

   let name=String(ins.name||"").trim();

   if(!name)return;

   let i=data.stores.findIndex(s=>
    normalizeName(s.name)===normalizeName(name)
   );

   let s=i<0?
    {id:ins.id||makeId(),name,items:[]}:
    data.stores[i];

   if(i<0){
    data.stores.push(s);
    i=data.stores.length-1;
   }

   if(!Array.isArray(ins.items))
    ins.items=[];

   s.name=name;

   s.items=ins.items.filter(Boolean).map(r=>{

    let old=s.items.find(x=>
     normalizeName(x.name)===normalizeName(r.name)
    );

    let x={
     id:r.id||old?.id||makeId(),
     name:String(r.name||"").trim(),
     price:r.price||"",
     desc:r.desc||"",
     last:Number(r.last||Date.now())
    };

    if(!seller)x.buy=r.buy||"";

    return x;
   });

   if(!first)first=s;
  });

  if(first)
   data.active=data.stores.indexOf(first);

  ensureIds();
  ensureItemIds();

  if(seller)cleanSellerData();

  importLedgerFromPackage(incoming.ledger,seller);

  save();
  saveLedger();

  updateStoreButton();
  applyMode();

  alert(
   "لیست با موفقیت وارد شد.\n\n"+
   "فروشگاه و کالاها مطابق فایل تنظیم شدند."
  );

 }catch(e){
  alert(
   "فایل انتخاب‌شده معتبر نیست.\n\n"+
   "لطفاً فایل لیست PriceYar را انتخاب کن."
  );
 }
};

function importPriceList(e){
 let f=e.target.files[0];

 if(!f)return;

 let r=new FileReader();

 r.onload=()=>{
  receiveImportedPriceList(r.result);
 };

 r.readAsText(f);

 e.target.value="";
}


/* ---------------- دفتر حساب ---------------- */

function ensureLedger(){

 if(!Array.isArray(ledger.accounts))
  ledger.accounts=[];

 ledger.accounts.forEach(a=>{

  if(!a.id)a.id=makeId();

  if(!a.name)a.name="بدون نام";

  if(a.type!=="creditor"&&a.type!=="debtor")
   a.type="creditor";

  if(!Array.isArray(a.transactions))
   a.transactions=[];

  a.transactions.forEach(t=>{
   if(!t.id)t.id=makeId();
   if(!t.amount)t.amount="0";
   if(!t.date)t.date=t.createdAt?
    new Date(t.createdAt).toISOString().slice(0,10):
    today();
  });
 });
}

function accountTotal(a){
 return (a.transactions||[]).reduce(
  (sum,t)=>sum+parseAmount(t.amount),0
 );
}

function openLedger(){

 ensureLedger();

 if(isSeller()){
  ledgerFilter="creditor";
  $("ledgerAddBtn").style.display="none";
 }else{
  $("ledgerAddBtn").style.display="block";
 }

 renderAccounts();

 openLayer("ledgerModal");
}

function setLedgerFilter(type){

 if(isSeller()&&type==="debtor")
  return;

 ledgerFilter=type;

 renderAccounts();
}

$("ledgerSearch").addEventListener("input",renderAccounts);

function renderAccounts(){

 ensureLedger();

 $("creditorTab").classList.toggle(
  "active",ledgerFilter==="creditor"
 );

 $("debtorTab").classList.toggle(
  "active",ledgerFilter==="debtor"
 );

 let filtered=ledger.accounts.filter(a=>
  a.type===ledgerFilter
 );

 let q=$("ledgerSearch").value.trim().toLocaleLowerCase();

 if(q){
  filtered=filtered.filter(a=>
   String(a.name||"").toLocaleLowerCase().includes(q)||
   String(a.phone||"").toLocaleLowerCase().includes(q)||
   String(a.note||"").toLocaleLowerCase().includes(q)
  );
 }

 let total=filtered.reduce(
  (sum,a)=>sum+accountTotal(a),0
 );

 let typeClass=ledgerFilter==="creditor"?"creditor":"debtor";

 $("ledgerTotal").innerHTML=
  '<div class="totalBox '+typeClass+'">'+
   '<span>جمع کل '+(ledgerFilter==="creditor"?"طلب‌ها":"بدهی‌ها")+'</span>'+
   '<span class="totalNumber">'+formatAmount(total)+'</span>'+
  '</div>';

 let box=$("accountList");

 if(!filtered.length){
  box.innerHTML=
   '<div class="empty">'+
   (q?"حسابی پیدا نشد":
    ledgerFilter==="creditor"?
    "هنوز طلبی ثبت نشده است.":
    "هنوز بدهی‌ای ثبت نشده است.")+
   '</div>';
  return;
 }

 box.innerHTML="";

 filtered.forEach(a=>{

  let d=document.createElement("div");
  d.className="accountRow";

  let total=accountTotal(a);
  let color=a.type==="creditor"?"credit":"debit";

  d.innerHTML=
   '<div>'+
    '<div class="accountName">'+esc(a.name)+'</div>'+
    '<div class="accountTypeLabel '+
     a.type+'">'+
     (a.type==="creditor"?"طلب":"بدهی")+
    '</div>'+
    '<div class="accountMeta">'+
     (a.phone?esc(a.phone)+" • ":"")+
     faDigits(a.transactions.length)+" ثبت"+
    '</div>'+
   '</div>'+
   '<div class="balance '+color+'">'+
    formatAmount(total)+
   '</div>';

  d.onclick=()=>{
   openAccount(ledger.accounts.indexOf(a));
  };

  box.appendChild(d);
 });
}

function openAccount(i){

    '<button class="smallBtn danger" onclick="deleteAccount('+activeAccount+')">'+

 }

 $("creditorTypeBtn").classList.toggle(
  "active",

function saveAccount(){

 if(isSeller())return;

 let n=$("accountName").value.trim();

 if(!n){
  alert("نام حساب را وارد کن");
  return;
 }

 let a;

 if(accountEdit<0){

  a={
   id:makeId(),
   name:n,
   phone:$("accountPhone").value.trim(),
   note:$("accountNote").value.trim(),
   type:accountType,
   transactions:[]
  };

  ledger.accounts.push(a);

 }else{

  a=ledger.accounts[accountEdit];

  a.name=n;
  a.phone=$("accountPhone").value.trim();
  a.note=$("accountNote").value.trim();

  /*
   * اگر نوع حساب عوض شود، فقط نوع حساب تغییر می‌کند
   * و تمام ثبت‌های قبلی همان حساب باقی می‌مانند.
   */
  a.type=accountType;
 }

 saveLedger();

 closeLayer("accountFormModal");

 renderAccounts();

 if(activeAccount>=0){
  renderAccount();
 }
}

function deleteAccount(i){

 if(isSeller())return;

 ledger.accounts.splice(i,1);

 saveLedger();

 activeAccount=-1;

 closeLayer("accountModal");

}

function openTxForm(i=-1){

 if(isSeller()||activeAccount<0)return;

 txEdit=i;

 let a=ledger.accounts[activeAccount];

 let t=i<0?
  {amount:"",date:today(),note:""}:
  a.transactions[i];

function saveTransaction(){

 if(isSeller()||activeAccount<0)return;

 let amount=$("txAmount").value.trim();
 let date=$("txDate").value;

 if(!amount){
  alert("مبلغ را وارد کن");
  return;
 }

 if(!date){
  alert("تاریخ را وارد کن");
  return;
 }

 let a=ledger.accounts[activeAccount];

 let t=txEdit<0?
  {id:makeId()}:
  a.transactions[txEdit];

 t.amount=amount;
 t.date=date;
 t.note=$("txNote").value.trim();

 if(txEdit<0)
  a.transactions.push(t);

 saveLedger();

 closeLayer("txModal");

 renderAccount();
 renderAccounts();

function deleteTransaction(i){

 ledger.accounts[activeAccount]
 .transactions.splice(i,1);

 saveLedger();

 renderAccount();
 renderAccounts();
}


/* ورود دفتر حساب از فایل */

function importLedgerFromPackage(pkg,isIncomingSeller){

 if(!pkg||!Array.isArray(pkg.accounts))
  return;

 ensureLedger();

 let incoming=pkg.accounts.map(a=>({
  id:a.id||makeId(),
  name:a.name||"بدون نام",
  phone:a.phone||"",
  note:a.note||"",
  type:a.type==="debtor"?"debtor":"creditor",
  transactions:Array.isArray(a.transactions)?
   a.transactions.map(t=>({
    id:t.id||makeId(),
    amount:t.amount||"0",
    date:t.date||today(),
    note:t.note||""
   })):[]
 }));

 if(isIncomingSeller){

  /*
   * فایل فروشنده فقط طلب‌ها را دارد.
   * بدهی‌های مدیریت دست‌نخورده می‌مانند.
   */
  let debtors=ledger.accounts.filter(
   a=>a.type==="debtor"
  );

  let creditors=incoming.filter(
   a=>a.type==="creditor"
  );

  ledger.accounts=debtors.concat(creditors);

 }else{

  ledger.accounts=incoming;
 }
}


/* ---------------- بازگشت گوشی ---------------- */

/*
 * برای هر صفحه‌ای که باز می‌شود یک state در history ساخته می‌شود.
 * بنابراین دکمه Back خود گوشی همان کار بستن صفحه را انجام می‌دهد.
 */

function openLayer(id){

 let el=$(id);

 if(!el)return;

 el.style.display="flex";

 history.pushState(
  {priceyarLayer:id},
  "",
  location.href.split("#")[0]+"#"+id
 );

 historyDepth++;
}

function closeLayer(id,pop=true){

 let el=$(id);

 if(!el)return;

 el.style.display="none";

 if(pop&&historyDepth>0){
  historyDepth--;

  try{
   history.back();
  }catch(e){}
 }
}

function closeAllLayers(){

 [
  "modal",
  "settingsModal",
  "ledgerModal",
  "accountModal",
  "accountFormModal",
  "txModal"
 ].forEach(id=>{
  if($(id))$(id).style.display="none";
 });

 historyDepth=0;
}

window.addEventListener("popstate",function(){

 if(historyDepth>0)
  historyDepth--;

 let open=null;

 [
  "txModal",
  "accountFormModal",
  "accountModal",
  "ledgerModal",
  "settingsModal",
  "modal"
 ].forEach(id=>{
  if($(id).style.display==="flex")
   open=id;
 });

 if(open){

  $(open).style.display="none";

  if(open==="txModal"){
   return;
  }

  if(open==="accountFormModal"){
   return;
  }

  if(open==="accountModal"){
   activeAccount=-1;
   return;
  }

  if(open==="ledgerModal"){
   return;
  }

  if(open==="settingsModal"){
   return;
  }

  if(open==="modal"){
   edit=-1;
  }
 });


/* بستن با لمس بیرون صفحه */
[
 "modal",
 "settingsModal",
 "ledgerModal",
 "accountModal",
 "accountFormModal",
 "txModal"
].forEach(id=>{

 $(id).addEventListener("click",function(e){

  if(e.target.id!==id)return;

  closeLayer(id);
 });
});

 }catch(e){}

 window.addEventListener(

 );
