<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="مدیریت قیمت">
<link rel="manifest" href="manifest.json">
<title>مدیریت قیمت فروشگاه</title>

<style>

*{
box-sizing:border-box
}

html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:system-ui,-apple-system,"Noto Sans Arabic","Noto Sans",sans-serif
}

body{
min-height:100vh
}

body.light{
background:#f5f5f5;
color:#111
}

.app{
max-width:680px;
margin:auto;
padding:25px 14px 35px
}

.head{
margin-bottom:15px
}

.storeBox{
position:relative;
width:100%
}

.storeBtn{
width:100%;
height:57px;
border-radius:16px;
background:#111;
color:#fff;
border:1px solid #333;
font-size:23px;
font-weight:850;
text-align:center;
padding:5px 55px 0;
position:relative
}

.storeBtn:after{
content:"";
position:absolute;
left:10px;
top:50%;
width:36px;
height:36px;
transform:translateY(-50%);
border-radius:50%;
border:1px solid rgba(255,255,255,.12);
background:
linear-gradient(#aaa,#aaa) center 11px/20px 2px no-repeat,
linear-gradient(#aaa,#aaa) center 21px/13px 2px no-repeat,
rgba(255,255,255,.035);
opacity:.88
}

.storeBtn.emptyStore{
color:#aaa
}

.storeMenu{
display:none;
position:absolute;
z-index:20;
top:64px;
right:0;
left:0;
background:#151515;
border:1px solid #333;
border-radius:15px;
padding:8px;
box-shadow:0 15px 40px #000
}

.storeMenu.open{
display:block
}

.storeItem{
padding:13px;
border-radius:10px;
font-size:16px;
margin-bottom:4px
}

.storeItem.active{
background:#252525
}

.storeActions{
display:flex;
gap:8px;
margin-top:8px;
border-top:1px solid #292929;
padding-top:8px
}

.storeAction{
flex:1;
height:46px;
border-radius:12px;
border:1px solid #444;
background:#351010;
color:#fff;
font-size:15px;
font-weight:800
}

.storeAction.addStore{
background:#351010;
color:#fff;
border-color:#444
}

.storeAction.deleteStore{
background:#351010;
color:#fff
}

/* ابزار بالای صفحه */
.topTools{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin-top:8px
}

.ledgerBtn{
height:38px;
padding:0 15px;
border-radius:11px;
border:1px solid #333;
background:#151515;
color:#fff;
font-size:14px;
font-weight:800
}

.modeBadge{
text-align:left;
font-size:11px;
color:#777;
margin:0;
flex:1
}

.modeBadge.seller{
color:#aaa
}

.searchWrap{
position:relative
}

.search{
width:100%;
height:58px;
background:#151515;
border:1px solid #363636;
border-radius:16px;
color:#fff;
font-size:18px;
padding:0 52px 0 18px;
outline:0
}

.search:focus{
border-color:#666
}

.searchIcon{
position:absolute;
right:17px;
top:14px;
color:#aaa;
font-size:25px;
pointer-events:none
}

.quickRow{
display:flex;
gap:8px;
margin-top:10px
}

.add,
.more{
flex:1;
width:auto;
height:51px;
margin-top:0;
border-radius:14px;
font-size:16px;
font-weight:800
}

.add{
background:#000;
color:#64B4FF;
border:1px solid #333
}

.more{
background:#000;
color:#E8EAED;
border:1px solid #333
}

.more.on{
background:#000;
border-color:#64B4FF;
color:#64B4FF
}

.section{
display:flex;
justify-content:space-between;
margin:23px 5px 8px
}

.section span{
font-size:12px;
color:#777
}

.swipeWrap{
position:relative;
margin:8px 0;
border-radius:15px;
overflow:hidden;
touch-action:pan-y
}

.deleteBg{
position:absolute;
inset:0;
background:#b00000;
display:flex;
align-items:center;
z-index:0;
opacity:0;
transition:opacity .12s ease
}

.deleteBg.left{
justify-content:flex-start;
padding-left:24px
}

.deleteBg.right{
justify-content:flex-end;
padding-right:24px
}

.trash{
width:40px;
height:48px;
position:relative;
display:flex;
align-items:center;
justify-content:center
}

.trashCan{
width:20px;
height:25px;
border:2px solid rgba(255,255,255,.95);
border-top:0;
border-radius:2px 2px 4px 4px;
position:relative;
margin-top:7px
}

.trashCan:before{
content:"";
position:absolute;
width:24px;
height:2px;
background:#fff;
left:50%;
top:-5px;
transform:translateX(-50%);
border-radius:2px
}

.trashCan:after{
content:"";
position:absolute;
width:8px;
height:3px;
border:2px solid #fff;
border-bottom:0;
left:50%;
top:-10px;
transform:translateX(-50%);
border-radius:3px 3px 0 0
}

.trash .trashCan{
background:
linear-gradient(
to right,
transparent 0,
transparent 5px,
rgba(255,255,255,.9) 5px,
rgba(255,255,255,.9) 7px,
transparent 7px,
transparent 12px,
rgba(255,255,255,.9) 12px,
rgba(255,255,255,.9) 14px,
transparent 14px
)
}

.trash.open .trashCan:before{
transform:
translateX(-50%)
rotate(-16deg);
transform-origin:right center;
transition:transform .12s ease
}

.trash.open .trashCan:after{
transform:
translateX(-50%)
rotate(-16deg);
transform-origin:right center;
transition:transform .12s ease
}

.trashCan:before,
.trashCan:after{
transition:transform .12s ease
}

.row{
position:relative;
z-index:1;
background:#101010;
border:1px solid #252525;
border-radius:15px;
padding:13px 15px;
min-height:76px;
display:flex;
gap:12px;
align-items:center;
transition:
transform .18s ease,
background .18s ease;
will-change:transform;
user-select:none;
-webkit-user-select:none
}

.row.swiping{
transition:none
}

.info{
flex:1;
min-width:0
}

.name{
font-size:21px;
font-weight:850;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.sub,
.buy{
font-size:12px;
color:#888;
margin-top:4px;
line-height:1.7
}

.price{
font-size:21px;
font-weight:850;
white-space:nowrap;
color:#fff
}

.empty{
text-align:center;
color:#888;
padding:42px 10px
}

.back{
width:100%;
height:46px;
border-radius:12px;
margin-top:10px;
color:#aaa;
background:#111;
border:1px solid #333
}

.settingsBtn{
width:100%;
height:46px;
border-radius:12px;
margin-top:10px;
color:#fff;
background:#111;
border:1px solid #333;
font-size:15px;
font-weight:800
}

.file{
display:none
}

.modal{
display:none;
position:fixed;
inset:0;
background:#000c;
align-items:flex-end;
z-index:50
}

.sheet{
width:min(680px,100%);
background:#111;
border:1px solid #333;
border-radius:22px 22px 0 0;
padding:20px 18px 28px;
max-height:92vh;
overflow-y:auto
}

h2{
margin:0 0 12px
}

.input{
width:100%;
height:53px;
background:#1b1b1b;
border:1px solid #444;
border-radius:12px;
color:#fff;
font-size:17px;
padding:0 14px;
margin:5px 0;
outline:0
}

.textarea{
height:82px;
padding-top:12px;
resize:none
}

.actions{
display:flex;
gap:8px;
margin-top:9px
}

.btn{
flex:1;
height:51px;
border:0;
border-radius:13px;
background:#fff;
color:#000;
font-weight:800
}

.dark{
background:#252525;
color:#fff;
border:1px solid #444
}

.danger{
background:#351010;
color:#fff
}

/* دفتر حساب */

.ledgerSheet{
padding-bottom:30px
}

.ledgerHeader{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
margin-bottom:12px
}

.ledgerHeader h2{
margin:0
}

.ledgerSmallBtn{
height:42px;
padding:0 13px;
border-radius:11px;
border:1px solid #444;
background:#252525;
color:#fff;
font-weight:800
}

.accountCard{
background:#181818;
border:1px solid #333;
border-radius:15px;
padding:14px;
margin:9px 0
}

.accountTop{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.accountName{
font-size:18px;
font-weight:850
}

.accountPhone{
font-size:12px;
color:#888;
margin-top:4px
}

.accountBalance{
font-size:18px;
font-weight:850;
white-space:nowrap
}

.balanceDebit{
color:#ff6b6b
}

.balanceCredit{
color:#55d98b
}

.balanceZero{
color:#aaa
}

.accountNote{
font-size:12px;
color:#888;
line-height:1.7;
margin-top:7px
}

.accountButtons{
display:flex;
gap:7px;
margin-top:10px
}

.accountButtons button{
flex:1;
height:40px;
border-radius:10px;
border:1px solid #444;
background:#252525;
color:#fff;
font-weight:750
}

.accountButtons .danger{
background:#351010
}

.ledgerEmpty{
text-align:center;
padding:35px 10px;
color:#888;
line-height:2
}

.ledgerSummary{
display:flex;
gap:8px;
margin:10px 0
}

.ledgerSummaryBox{
flex:1;
border:1px solid #333;
border-radius:12px;
padding:10px;
text-align:center;
background:#151515
}

.ledgerSummaryTitle{
font-size:11px;
color:#888
}

.ledgerSummaryValue{
font-size:16px;
font-weight:850;
margin-top:4px
}

.transaction{
border:1px solid #303030;
border-radius:13px;
padding:12px;
margin:8px 0;
background:#151515
}

.transactionTop{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px
}

.transactionType{
font-size:13px;
font-weight:850
}

.transactionAmount{
font-size:17px;
font-weight:850
}

.transaction.debit .transactionType,
.transaction.debit .transactionAmount{
color:#ff6b6b
}

.transaction.credit .transactionType,
.transaction.credit .transactionAmount{
color:#55d98b
}

.transactionNote{
font-size:12px;
color:#888;
margin-top:5px;
line-height:1.7
}

.transactionActions{
display:flex;
gap:7px;
margin-top:9px
}

.transactionActions button{
flex:1;
height:37px;
border-radius:9px;
border:1px solid #444;
background:#252525;
color:#fff;
font-weight:700
}

.transactionActions .danger{
background:#351010
}

.ledgerBack{
width:100%;
height:46px;
margin-top:10px;
border-radius:12px;
border:1px solid #444;
background:#252525;
color:#fff;
font-weight:800
}

/* پنجره تنظیمات */

.settingsSheet{
padding-bottom:30px
}

.settingTitle{
font-size:13px;
color:#888;
margin:17px 2px 8px
}

.settingRow{
display:flex;
gap:8px;
flex-wrap:wrap
}

.settingOption{
flex:1;
min-width:90px;
height:44px;
border-radius:11px;
background:#181818;
border:1px solid #333;
color:#fff;
font-size:14px;
font-weight:700
}

.settingOption.active{
border-color:#aaa;
background:#292929
}

.colorOption{
height:38px;
min-width:55px
}

.colorWhite{
color:#fff
}

.colorBlue{
color:#64B4FF
}

.colorGreen{
color:#55d98b
}

.colorYellow{
color:#ffd75a
}

.colorRed{
color:#ff6b6b
}

.settingsClose{
margin-top:18px;
width:100%;
height:48px;
border-radius:12px;
border:1px solid #444;
background:#252525;
color:#fff;
font-weight:800
}

/* حالت روشن */

body.light .storeBtn,
body.light .search,
body.light .row,
body.light .back,
body.light .settingsBtn,
body.light .add,
body.light .more,
body.light .ledgerBtn{
background:#fff;
color:#111;
border-color:#ddd
}

body.light .storeMenu{
background:#fff;
border-color:#ddd;
box-shadow:0 15px 40px #0002
}

body.light .storeItem.active{
background:#eee
}

body.light .storeActions{
border-top-color:#ddd
}

body.light .search::placeholder{
color:#999
}

body.light .searchIcon{
color:#777
}

body.light .section span,
body.light .sub,
body.light .buy{
color:#777
}

body.light .sheet{
background:#fff;
color:#111;
border-color:#ddd
}

body.light .input{
background:#f5f5f5;
color:#111;
border-color:#ccc
}

body.light .dark{
background:#eee;
color:#111;
border-color:#ccc
}

body.light .settingOption{
background:#f5f5f5;
color:#111;
border-color:#ddd
}

body.light .settingOption.active{
background:#e5e5e5;
border-color:#999
}

body.light .settingsClose{
background:#eee;
color:#111;
border-color:#ccc
}

body.light .accountCard,
body.light .ledgerSummaryBox,
body.light .transaction{
background:#f5f5f5;
border-color:#ddd
}

body.light .accountButtons button,
body.light .transactionActions button,
body.light .ledgerBack,
body.light .ledgerSmallBtn{
background:#eee;
color:#111;
border-color:#ccc
}

body.light .storeBtn:after{
border-color:rgba(0,0,0,.12);
background:
linear-gradient(#555,#555) center 11px/20px 2px no-repeat,
linear-gradient(#555,#555) center 21px/13px 2px no-repeat,
rgba(0,0,0,.035)
}

@media(max-width:430px){

.app{
padding-left:10px;
padding-right:10px;
padding-top:25px
}

.storeBtn{
font-size:21px;
padding-top:5px
}

.add,
.more{
font-size:14px
}

.name,
.price{
font-size:20px
}

}

</style>
</head>

<body>

<main class="app">

<div class="head">

<div class="storeBox">

<button
class="storeBtn emptyStore"
id="storeBtn">
</button>

<div
id="storeMenu"
class="storeMenu">
</div>

</div>

<div class="topTools">

<button
class="ledgerBtn"
onclick="openLedger()">
دفتر حساب
</button>

<div
id="modeBadge"
class="modeBadge">
</div>

</div>

</div>

<div class="searchWrap">

<span class="searchIcon">
⌕
</span>

<input
id="search"
class="search"
autocomplete="off"
placeholder="جستجوی کالا...">

</div>

<div class="quickRow">

<button
class="add"
onclick="openAdd()">
＋ افزودن کالا
</button>

<button
class="more"
id="moreBtn"
onclick="toggleMore()">
اطلاعات ○
</button>

</div>

<div class="section">

<b id="title">
کالاهای اخیر
</b>

<span id="count">
</span>

</div>

<div id="list">
</div>

<button
class="back"
onclick="exportPriceList()">
<span style="color:#fff">
➤
</span>
ارسال لیست
</button>

<button
class="back"
onclick="updatePriceList()">
<span style="color:#fff">
↻
</span>
به‌روزرسانی لیست
</button>

<button
class="settingsBtn"
onclick="openSettings()">
⚙ تنظیمات
</button>

<input
id="updateFile"
class="file"
type="file"
accept=".json,application/json"
onchange="importPriceList(event)">

</main>

<!-- پنجره افزودن / ویرایش کالا -->

<div
id="modal"
class="modal">

<div class="sheet">

<h2 id="mtitle">
افزودن کالا
</h2>

<input
id="name"
class="input"
placeholder="نام کالا">

<input
id="price"
class="input"
placeholder="قیمت"
inputmode="numeric">

<div id="buyWrap">

<input
id="buy"
class="input"
placeholder="قیمت خرید (اختیاری)"
inputmode="numeric">

</div>

<textarea
id="desc"
class="input textarea"
placeholder="توضیحات (اختیاری)">
</textarea>

<div class="actions">

<button
class="btn"
onclick="saveItem()">
ذخیره
</button>

<button
class="btn dark"
onclick="closeModal()">
انصراف
</button>

<button
id="del"
class="btn danger"
onclick="deleteItem()">
حذف
</button>

</div>

</div>
</div>

<!-- دفتر حساب -->

<div
id="ledgerModal"
class="modal">

<div class="sheet ledgerSheet">

<div class="ledgerHeader">

<h2>
دفتر حساب
</h2>

<button
class="ledgerSmallBtn"
onclick="openAccountEdit(-1)">
＋ حساب جدید
</button>

</div>

<div id="ledgerContent">
</div>

<button
class="ledgerBack"
onclick="closeLedger()">
بستن
</button>

</div>
</div>

<!-- پنجره حساب -->

<div
id="accountModal"
class="modal">

<div class="sheet">

<h2 id="accountTitle">
حساب جدید
</h2>

<input
id="accountName"
class="input"
placeholder="نام طرف حساب">

<input
id="accountPhone"
class="input"
placeholder="شماره تماس"
inputmode="tel">

<textarea
id="accountNote"
class="input textarea"
placeholder="توضیحات (اختیاری)">
</textarea>

<div class="actions">

<button
class="btn"
onclick="saveAccount()">
ذخیره
</button>

<button
class="btn dark"
onclick="closeAccountModal()">
انصراف
</button>

<button
id="accountDelete"
class="btn danger"
onclick="deleteAccount()">
حذف
</button>

</div>

</div>
</div>

<!-- پنجره حساب و تراکنش‌ها -->

<div
id="accountDetailModal"
class="modal">

<div class="sheet ledgerSheet">

<div class="ledgerHeader">

<h2 id="accountDetailTitle">
حساب
</h2>

<button
id="addTransactionButton"
class="ledgerSmallBtn"
onclick="openTransactionEdit(-1)">
＋ ثبت حساب
</button>

</div>

<div id="accountDetailContent">
</div>

<button
class="ledgerBack"
onclick="closeAccountDetail()">
بازگشت
</button>

</div>
</div>

<!-- پنجره تراکنش -->

<div
id="transactionModal"
class="modal">

<div class="sheet">

<h2 id="transactionTitle">
ثبت حساب
</h2>

<div class="settingTitle">
نوع تراکنش
</div>

<div class="settingRow">

<button
id="debitTypeButton"
class="settingOption"
onclick="setTransactionType('debit')">
بدهکار
</button>

<button
id="creditTypeButton"
class="settingOption"
onclick="setTransactionType('credit')">
بستانکار
</button>

</div>

<input
id="transactionAmount"
class="input"
placeholder="مبلغ"
inputmode="numeric">

<textarea
id="transactionNote"
class="input textarea"
placeholder="توضیحات تراکنش">
</textarea>

<div class="actions">

<button
class="btn"
onclick="saveTransaction()">
ذخیره
</button>

<button
class="btn dark"
onclick="closeTransactionModal()">
انصراف
</button>

<button
id="transactionDelete"
class="btn danger"
onclick="deleteTransaction()">
حذف
</button>

</div>

</div>
</div>

<!-- پنجره تنظیمات -->

<div
id="settingsModal"
class="modal">

<div class="sheet settingsSheet">

<h2>
تنظیمات
</h2>

<div class="settingTitle">
حالت نمایش
</div>

<div class="settingRow">

<button
id="darkOption"
class="settingOption"
onclick="setTheme('dark')">
تیره
</button>

<button
id="lightOption"
class="settingOption"
onclick="setTheme('light')">
روشن
</button>

</div>

<div class="settingTitle">
رنگ قیمت‌ها
</div>

<div class="settingRow">

<button
class="settingOption colorOption colorWhite"
onclick="setPriceColor('#fff')">
سفید
</button>

<button
class="settingOption colorOption colorBlue"
onclick="setPriceColor('#64B4FF')">
آبی
</button>

<button
class="settingOption colorOption colorGreen"
onclick="setPriceColor('#55d98b')">
سبز
</button>

<button
class="settingOption colorOption colorYellow"
onclick="setPriceColor('#ffd75a')">
زرد
</button>

<button
class="settingOption colorOption colorRed"
onclick="setPriceColor('#ff6b6b')">
قرمز
</button>

</div>

<div class="settingTitle">
نمایش اعداد
</div>

<div class="settingRow">

<button
id="faDigitsOption"
class="settingOption"
onclick="setDigits('fa')">
فارسی
</button>

<button
id="enDigitsOption"
class="settingOption"
onclick="setDigits('en')">
لاتین
</button>

</div>

<button
class="settingsClose"
onclick="closeSettings()">
بستن
</button>

</div>
</div>

<script>

const K="priceYarStoresV3";

function makeId(){

if(
window.crypto&&
window.crypto.randomUUID
){

return window.crypto.randomUUID();

}

return
"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
.replace(
/[xy]/g,
c=>{

let r=
Math.random()*16|0;

let v=
c==="x"
?
r
:
(r&3|8);

return v.toString(16);

}
);

}

function setupSwipe(
wrap,
row,
trashLeft,
trashRight,
index
){

let startX=0;
let startY=0;
let currentX=0;
let horizontal=false;
let moved=false;

function pointerDown(e){

if(e.pointerType==="mouse"&&e.button!==0){

return;

}

startX=e.clientX;
startY=e.clientY;
currentX=0;
horizontal=false;
moved=false;

row.classList.remove("swiping");

try{

row.setPointerCapture(e.pointerId);

}catch(_){}

}

function pointerMove(e){

if(
startX===null||
startY===null
){

return;

}

const dx=
e.clientX-startX;

const dy=
e.clientY-startY;

if(!horizontal){

if(
Math.abs(dx)<8&&
Math.abs(dy)<8
){

return;

}

if(
Math.abs(dy)>
Math.abs(dx)
){

startX=null;
startY=null;
return;

}

horizontal=true;

}

if(!horizontal){

return;

}

e.preventDefault();

moved=true;

currentX=dx;

const limit=
Math.min(
Math.abs(dx),
window.innerWidth*0.55
);

const signed=
dx<0
?
-limit
:
limit;

row.classList.add("swiping");

row.style.transform=
"translateX("+signed+"px)";

const progress=
Math.min(
Math.abs(signed)/110,
1
);

const opacity=
Math.min(
progress,
1
);

if(dx>0){

bgLeft.style.opacity=opacity;
bgRight.style.opacity=0;

trashLeft.classList.toggle(
"open",
Math.abs(signed)>35
);

trashRight.classList.remove("open");

}else{

bgRight.style.opacity=opacity;
bgLeft.style.opacity=0;

trashRight.classList.toggle(
"open",
Math.abs(signed)>35
);

trashLeft.classList.remove("open");

}

}

function pointerUp(e){

if(
startX===null
){

return;

}

const dx=currentX;

startX=null;
startY=null;

if(!horizontal){

return;

}

const threshold=
Math.max(
95,
Math.min(
140,
window.innerWidth*.25
)
);

if(
Math.abs(dx)>=threshold
){

const direction=
dx>0
?
1
:
-1;

row.style.transition=
"transform .18s ease";

row.style.transform=
"translateX("+
(direction*
(window.innerWidth+100))+
"px)";

bgLeft.style.opacity=
dx>0
?
1
:
0;

bgRight.style.opacity=
dx<0
?
1
:
0;

setTimeout(
()=>{

removeItemByIndex(index);

},
180
);

}else{

row.style.transition=
"transform .18s ease";

row.style.transform=
"translateX(0)";

bgLeft.style.opacity=0;
bgRight.style.opacity=0;

trashLeft.classList.remove("open");
trashRight.classList.remove("open");

}

}

function pointerCancel(){

startX=null;
startY=null;
horizontal=false;

row.style.transition=
"transform .18s ease";

row.style.transform=
"translateX(0)";

bgLeft.style.opacity=0;
bgRight.style.opacity=0;

trashLeft.classList.remove("open");
trashRight.classList.remove("open");

}

row.addEventListener(
"pointerdown",
pointerDown,
{
passive:true
}
);

row.addEventListener(
"pointermove",
pointerMove,
{
passive:false
}
);

row.addEventListener(
"pointerup",
pointerUp
);

row.addEventListener(
"pointercancel",
pointerCancel
);

row.addEventListener(
"click",
e=>{

if(moved){

e.preventDefault();
e.stopPropagation();
return;

}

openEdit(index);

});

}

function accountById(id){

ensureLedger();

return ledgerData.accounts.find(
account=>
account.id===id
);

}

function accountBalance(account){

if(!account){

return 0;

}

let debit=0;
let credit=0;

(account.transactions||[]).forEach(
transaction=>{

let amount=
Number(
String(
transaction.amount||""
)
.replace(/,/g,"")
)||0;

if(transaction.type==="credit"){

credit+=amount;

}else{

debit+=amount;

}

});

return debit-credit;

}

function accountTotals(account){

let debit=0;
let credit=0;

(account.transactions||[]).forEach(
transaction=>{

let amount=
Number(
String(
transaction.amount||""
)
.replace(/,/g,"")
)||0;

if(transaction.type==="credit"){

credit+=amount;

}else{

debit+=amount;

}

});

return {
debit:debit,
credit:credit,
balance:debit-credit
};

}

function formatMoney(value){

return faDigits(
Number(value||0).toLocaleString("en-US")
);

}

function balanceClass(balance){

if(balance>0){

return "balanceDebit";

}

if(balance<0){

return "balanceCredit";

}

return "balanceZero";

}

function balanceText(balance){

if(balance>0){

return "بدهکار: "+
formatMoney(balance);

}

if(balance<0){

return "بستانکار: "+
formatMoney(Math.abs(balance));

}

return "تسویه";

}

"لیست جدید قیمت‌ها - برای به‌روزرسانی لمس کنید.json";

window.receiveImportedPriceList=
function(text){

try{

const incoming=
JSON.parse(text);

if(
!incoming||
incoming.type!=="priceyar-price-list"||
!Array.isArray(incoming.stores)
){

throw new Error("invalid");

}

let isSellerFile=false;

if(
incoming.shareMode==="seller"
){

isSellerFile=true;

}else if(
incoming.shareMode==="management"
){

isSellerFile=false;

}else{

let allItems=[];

incoming.stores.forEach(
store=>{

if(
Array.isArray(store.items)
){

allItems=
allItems.concat(
store.items
);

}

});

if(allItems.length>0){

isSellerFile=
allItems.every(
item=>
!Object.prototype.hasOwnProperty.call(
item,
"buy"
)
);

}

}

setMode(
isSellerFile
?
"seller"
:
"management"
);

if(!Array.isArray(data.stores)){

data.stores=[];

}

let updatedStores=0;

let addedStores=0;

let updatedItems=0;

let addedItems=0;

let firstImportedStore=null;

incoming.stores.forEach(
inStore=>{

if(!inStore){

return;

}

const incomingName=
String(
inStore.name||
""
).trim();

if(!incomingName){

return;

}

let localIndex=
data.stores.findIndex(
s=>
normalizeName(s.name)===
normalizeName(incomingName)
);

let localStore;

if(localIndex<0){

localStore={
id:
inStore.id||
makeId(),

name:
incomingName,

items:[]
};

data.stores.push(localStore);

localIndex=
data.stores.length-1;

addedStores++;

}else{

localStore=
data.stores[localIndex];

updatedStores++;

if(!localStore.id){

localStore.id=
inStore.id||
makeId();

}

}

if(!Array.isArray(inStore.items)){

inStore.items=[];

}

const newItems=[];

inStore.items.forEach(
remoteItem=>{

if(!remoteItem){

return;

}

const remoteName=
String(
remoteItem.name||
""
).trim();

if(!remoteName){

return;

}

const oldItem=
localStore.items.find(
item=>
normalizeName(item.name)===
normalizeName(remoteName)
);

const newItem={
id:
remoteItem.id||
(oldItem&&oldItem.id)||
makeId(),

name:
remoteName,

price:
remoteItem.price||"",

desc:
remoteItem.desc||"",

last:
Number(
remoteItem.last||
Date.now()
)
};

if(!isSellerFile){

newItem.buy=
remoteItem.buy||
"";

}

newItems.push(newItem);

if(oldItem){

updatedItems++;

}else{

addedItems++;

}

});

localStore.name=
incomingName;

localStore.items=
newItems;

if(!firstImportedStore){

firstImportedStore=
localStore;

}

});

if(firstImportedStore){

const importedIndex=
data.stores.indexOf(
firstImportedStore
);

if(importedIndex>=0){

data.active=
importedIndex;

}

}

ensureIds();

ensureItemIds();

if(isSellerFile){

cleanSellerData();

}

save();

updateStoreButton();

applyMode();

const totalChanged=
updatedStores+
addedStores+
updatedItems+
addedItems;

if(totalChanged){

alert(
"لیست با موفقیت وارد شد.\n\n"+
"فروشگاه و کالاها دقیقاً مطابق فایل تنظیم شدند."
);

}else{

alert(
"لیست وارد شد و وضعیت فروشگاه مطابق فایل تنظیم شد."
);

}

}catch(error){

console.log(
"Import error:",
error
);

alert(
"فایل انتخاب‌شده معتبر نیست.\n\n"+
"لطفاً فایل لیست PriceYar را انتخاب کن."
);

}

};

function importPriceList(e){

const file=
e.target.files[0];

if(!file){

}

const reader=
new FileReader();

reader.onload=()=>
{

window.receiveImportedPriceList(
reader.result
);

};

reader.readAsText(file);

e.target.value="";

}
