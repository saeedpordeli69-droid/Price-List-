<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="مدیریت قیمت">
<link rel="manifest" href="manifest.json">
<title>مدیریت قیمت فروشگاه</title>

<style>
*{
box-sizing:border-box
}

html,body{
margin:0;
padding:0;
background:#000;
color:#fff;
font-family:system-ui,-apple-system,"Noto Sans Arabic","Noto Sans",sans-serif
}

body{
min-height:100vh
}

.app{
max-width:680px;
margin:auto;
padding:15px 14px 35px
}

.head{
margin-bottom:15px
}

.storeBox{
position:relative;
width:100%
}

.storeBtn{
width:100%;
height:57px;
border-radius:16px;
background:#111;
color:#fff;
border:1px solid #333;
font-size:23px;
font-weight:850;
text-align:center;
padding:5px 55px 0;
position:relative
}

.storeBtn:after{
content:"⋮";
position:absolute;
left:18px;
top:50%;
transform:translateY(-45%);
color:#aaa;
font-size:27px;
font-weight:700
}

.storeBtn.emptyStore{
color:#aaa
}

.storeMenu{
display:none;
position:absolute;
z-index:20;
top:64px;
right:0;
left:0;
background:#151515;
border:1px solid #333;
border-radius:15px;
padding:8px;
box-shadow:0 15px 40px #000
}

.storeMenu.open{
display:block
}

.storeItem{
padding:13px;
border-radius:10px;
font-size:16px;
margin-bottom:4px
}

.storeItem.active{
background:#252525
}

.storeActions{
display:flex;
gap:8px;
margin-top:8px;
border-top:1px solid #292929;
padding-top:8px
}

.storeAction{
flex:1;
height:46px;
border-radius:12px;
border:1px solid #444;
background:#222;
color:#64B4FF;
font-size:15px;
font-weight:800
}

.storeAction.addStore{
background:#000;
color:#64B4FF;
border-color:#333
}

.storeAction.deleteStore{
background:#351010;
color:#fff
}

.searchWrap{
position:relative
}

.search{
width:100%;
height:58px;
background:#151515;
border:1px solid #363636;
border-radius:16px;
color:#fff;
font-size:18px;
padding:0 52px 0 18px;
outline:0
}

.search:focus{
border-color:#666
}

.searchIcon{
position:absolute;
right:17px;
top:14px;
color:#aaa;
font-size:25px;
pointer-events:none
}

.quickRow{
display:flex;
gap:8px;
margin-top:10px
}

.add,
.more{
flex:1;
width:auto;
height:51px;
margin-top:0;
border-radius:14px;
font-size:16px;
font-weight:800
}

.add{
background:#000;
color:#64B4FF;
border:1px solid #333
}

.more{
background:#000;
color:#E8EAED;
border:1px solid #333
}

.more.on{
background:#000;
border-color:#64B4FF;
color:#64B4FF
}

.section{
display:flex;
justify-content:space-between;
margin:23px 5px 8px
}

.section span{
font-size:12px;
color:#777
}

.row{
background:#101010;
border:1px solid #252525;
border-radius:15px;
margin:8px 0;
padding:13px 15px;
min-height:76px;
display:flex;
gap:12px;
align-items:center
}

.info{
flex:1;
min-width:0
}

.name{
font-size:21px;
font-weight:850;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.sub,
.buy{
font-size:12px;
color:#888;
margin-top:4px;
line-height:1.7
}

.price{
font-size:21px;
font-weight:850;
white-space:nowrap
}

.empty{
text-align:center;
color:#888;
padding:42px 10px
}

.back{
width:100%;
height:46px;
border-radius:12px;
margin-top:10px;
color:#aaa;
background:#111;
border:1px solid #333
}

.note{
text-align:center;
color:#666;
font-size:11px;
margin-top:8px;
line-height:1.8
}

.file{
display:none
}

.modal{
display:none;
position:fixed;
inset:0;
background:#000c;
align-items:flex-end;
z-index:50
}

.sheet{
width:min(680px,100%);
background:#111;
border:1px solid #333;
border-radius:22px 22px 0 0;
padding:20px 18px 28px
}

h2{
margin:0 0 12px
}

.input{
width:100%;
height:53px;
background:#1b1b1b;
border:1px solid #444;
border-radius:12px;
color:#fff;
font-size:17px;
padding:0 14px;
margin:5px 0;
outline:0
}

.textarea{
height:82px;
padding-top:12px;
resize:none
}

.actions{
display:flex;
gap:8px;
margin-top:9px
}

.btn{
flex:1;
height:51px;
border:0;
border-radius:13px;
background:#fff;
color:#000;
font-weight:800
}

.dark{
background:#252525;
color:#fff;
border:1px solid #444
}

.danger{
background:#351010;
color:#fff
}

.modeBadge{
text-align:center;
font-size:11px;
color:#777;
margin-top:8px
}

.modeBadge.seller{
color:#aaa
}

@media(max-width:430px){

.app{
padding-left:10px;
padding-right:10px
}

.storeBtn{
font-size:21px;
padding-top:5px
}

.add,
.more{
font-size:14px
}

.name,
.price{
font-size:20px
}

}
</style>
</head>

<body>

<main class="app">

<div class="head">

<div class="storeBox">

<button
class="storeBtn emptyStore"
id="storeBtn">
⋮
</button>

<div
id="storeMenu"
class="storeMenu">
</div>

</div>

<div
id="modeBadge"
class="modeBadge">
</div>

</div>

<div class="searchWrap">

<span class="searchIcon">
⌕
</span>

<input
id="search"
class="search"
autocomplete="off"
placeholder="جستجوی کالا...">

</div>

<div class="quickRow">

<button
class="add"
onclick="openAdd()">
＋ افزودن کالا
</button>

<button
class="more"
id="moreBtn"
onclick="toggleMore()">
اطلاعات ○
</button>

</div>

<div class="section">

<b id="title">
کالاهای اخیر
</b>

<span id="count">
</span>

</div>

<div id="list">
</div>

<button
class="back"
onclick="exportPriceList()">
<span style="color:#fff">
➤
</span>
ارسال لیست
</button>

<button
class="back"
onclick="updatePriceList()">
<span style="color:#fff">
↻
</span>
به‌روزرسانی لیست
</button>

<input
id="updateFile"
class="file"
type="file"
accept=".json,application/json"
onchange="importPriceList(event)">

</main>

<div
id="modal"
class="modal">

<div class="sheet">

<h2 id="mtitle">
افزودن کالا
</h2>

<input
id="name"
class="input"
placeholder="نام کالا">

<input
id="price"
class="input"
placeholder="قیمت"
inputmode="numeric">

<div id="buyWrap">

<input
id="buy"
class="input"
placeholder="قیمت خرید (اختیاری)"
inputmode="numeric">

</div>

<textarea
id="desc"
class="input textarea"
placeholder="توضیحات (اختیاری)">
</textarea>

<div class="actions">

<button
class="btn"
onclick="saveItem()">
ذخیره
</button>

<button
class="btn dark"
onclick="closeModal()">
انصراف
</button>

<button
id="del"
class="btn danger"
onclick="deleteItem()">
حذف
</button>

</div>

</div>
</div>

<script>

const K="priceYarStoresV3";

const MODE_KEY="priceYarAppMode";

let data=
JSON.parse(
localStorage.getItem(K)||"null"
)
||
{
active:-1,
stores:[],
deleted:{}
};

let appMode=
localStorage.getItem(MODE_KEY)
||
"management";

let edit=-1;

let more=false;

const $=id=>
document.getElementById(id);

const st=()=>
data.stores[data.active];

function normalizeName(name){

return String(name||"")
.trim()
.replace(/\s+/g," ")
.toLocaleLowerCase();

}

function isSeller(){

return appMode==="seller";

}

function setMode(mode){

appMode=
mode==="seller"
?
"seller"
:
"management";

localStorage.setItem(
MODE_KEY,
appMode
);

applyMode();

}

function applyMode(){

const seller=isSeller();

const buyWrap=$("buyWrap");

if(buyWrap){

buyWrap.style.display=
seller
?
"none"
:
"block";

}

if(seller){

$("modeBadge").textContent=
"حالت فروشندگان";

$("modeBadge").classList.add("seller");

}else{

$("modeBadge").textContent=
"حالت مدیریت";

$("modeBadge").classList.remove("seller");

}

$("moreBtn").textContent=
more
?
"اطلاعات ✓"
:
"اطلاعات ○";

render();

}

function makeId(){

if(
window.crypto&&
window.crypto.randomUUID
){

return window.crypto.randomUUID();

}

return
"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx"
.replace(
/[xy]/g,
c=>{

let r=
Math.random()*16|0;

let v=
c==="x"
?
r
:
(r&3|8);

return v.toString(16);

}
);

}

function ensureIds(){

if(!Array.isArray(data.stores)){

data.stores=[];

}

data.stores.forEach(
s=>{

if(!s.id){

s.id=makeId();

}

if(!Array.isArray(s.items)){

s.items=[];

}

});

if(
data.stores.length===0
){

data.active=-1;

}else if(
data.active<0||
data.active>=data.stores.length
){

data.active=0;

}

}

function ensureItemIds(){

data.stores.forEach(
store=>{

if(!Array.isArray(store.items)){

store.items=[];

}

store.items.forEach(
item=>{

if(!item.id){

item.id=makeId();

}

if(!item.last){

item.last=Date.now();

}

});

});

if(!data.deleted){

data.deleted={};

}

}

function cleanSellerData(){

if(!isSeller()){

return;

}

data.stores.forEach(
store=>{

if(!Array.isArray(store.items)){

return;

}

store.items.forEach(
item=>{

delete item.buy;
delete item.buyPrice;
delete item.purchasePrice;

});

});

}

function faDigits(value){

return String(
value??""
)
.replace(
/\d/g,
d=>"۰۱۲۳۴۵۶۷۸۹"[d]
);

}

function save(){

ensureIds();

ensureItemIds();

if(isSeller()){

cleanSellerData();

}

localStorage.setItem(
K,
JSON.stringify(data)
);

if(
window.AndroidBridge&&
AndroidBridge.saveData
){

try{

AndroidBridge.saveData(
JSON.stringify(data)
);

}catch(e){

console.log(
"Native save error:",
e
);

}

}

}

function esc(s){

return String(
s??""
)
.replace(
/[&<>"']/g,
m=>
({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}

function render(){

ensureIds();

ensureItemIds();

if(!st()){

$("storeBtn").textContent=
"⋮";

$("storeBtn")
.classList.add("emptyStore");

$("title").textContent=
"فروشگاهی انتخاب نشده";

$("count").textContent="";

$("list").innerHTML=
'<div class="empty">برای شروع، از منوی ⋮ یک فروشگاه بسازید یا فایل لیست را اضافه کنید.</div>';

return;

}

$("storeBtn")
.classList.remove("emptyStore");

$("storeBtn").textContent=
st().name;

let q=
$("search")
.value
.trim()
.toLocaleLowerCase();

let a=
st().items
.filter(
x=>
!q||
String(x.name||"")
.toLocaleLowerCase()
.includes(q)
)
.sort(
(x,y)=>
(y.last||0)-
(x.last||0)
);

$("title").textContent=
q
?
"نتایج جستجو"
:
"کالاهای اخیر";

$("count").textContent=
q
?
a.length+" نتیجه"
:
st().items.length+" کالا";

$("list").innerHTML="";

if(!a.length){

$("list").innerHTML=
'<div class="empty">'+
(
q
?
"کالایی پیدا نشد"
:
"هنوز کالایی اضافه نشده"
)+
"</div>";

return;

}

a.forEach(
x=>{

let i=
st().items.indexOf(x);

let extra="";

if(more){

if(
!isSeller() &&
x.buy
){

extra+=
'<div class="buy">'+
"قیمت خرید: "+
esc(faDigits(x.buy))+
"</div>";

}

if(x.desc){

extra+=
'<div class="sub">'+
esc(x.desc)+
"</div>";

}

}

let r=
document.createElement("div");

r.className="row";

r.innerHTML=
'<div class="info">'+
'<div class="name">'+
esc(x.name)+
"</div>"+
extra+
'</div>'+
'<div class="price">'+
esc(faDigits(x.price))+
"</div>";

r.onclick=()=>
openEdit(i);

$("list")
.appendChild(r);

});

}

$("storeBtn").onclick=()=>{

let menu=
$("storeMenu");

if(
menu.classList.contains("open")
){

menu.classList.remove("open");

}else{

stores();

menu.classList.add("open");

}

};

function stores(){

let m=
$("storeMenu");

m.innerHTML="";

data.stores.forEach(
(s,i)=>{

let d=
document.createElement("div");

d.className=
"storeItem"+
(
i===data.active
?
" active"
:
""
);

d.textContent=
(
i===data.active
?
"✓ "
:
""
)+
s.name;

d.onclick=()=>{

data.active=i;

save();

$("storeMenu")
.classList.remove("open");

updateStoreButton();

render();

};

m.appendChild(d);

});

let actions=
document.createElement("div");

actions.className=
"storeActions";

let add=
document.createElement("button");

add.className=
"storeAction addStore";

add.textContent=
"＋ ساختن فروشگاه";

add.onclick=()=>{

$("storeMenu")
.classList.remove("open");

createStore();

};

let importStore=
document.createElement("button");

importStore.className=
"storeAction";

importStore.textContent=
"＋ اضافه کردن فروشگاه";

importStore.onclick=()=>{

$("storeMenu")
.classList.remove("open");

updatePriceList();

};

actions.appendChild(add);

actions.appendChild(importStore);

if(data.stores.length>0){

let del=
document.createElement("button");

del.className=
"storeAction deleteStore";

del.textContent=
"− حذف فروشگاه";

del.onclick=()=>{

$("storeMenu")
.classList.remove("open");

deleteStore();

};

actions.appendChild(del);

}

m.appendChild(actions);

}

function updateStoreButton(){

if(!st()){

$("storeBtn").textContent=
"⋮";

$("storeBtn")
.classList.add("emptyStore");

return;

}

$("storeBtn")
.classList.remove("emptyStore");

$("storeBtn").textContent=
st().name;

}

function createStore(){

let n=
prompt(
"نام فروشگاه جدید را وارد کنید:"
);

if(
!n||
!n.trim()
){

return;

}

n=n.trim();

const existing=
data.stores.find(
s=>
normalizeName(s.name)===
normalizeName(n)
);

if(existing){

data.active=
data.stores.indexOf(existing);

save();

updateStoreButton();

render();

alert(
"این فروشگاه قبلاً وجود دارد و انتخاب شد."
);

return;

}

data.stores.push(
{
id:makeId(),
name:n,
items:[]
}
);

data.active=
data.stores.length-1;

save();

updateStoreButton();

render();

}

function deleteStore(){

if(!st()){

return;

}

let name=
st().name;

if(
!confirm(
"فروشگاه «"+
name+
"» حذف شود؟\n\n"+
"تمام کالاهای این فروشگاه هم حذف می‌شوند."
)
){

return;

}

data.stores.splice(
data.active,
1
);

if(
data.stores.length===0
){

data.active=-1;

}else if(
data.active>=data.stores.length
){

data.active=
data.stores.length-1;

}

save();

updateStoreButton();

render();

}

function toggleMore(){

more=!more;

$("moreBtn").textContent=
more
?
"اطلاعات ✓"
:
"اطلاعات ○";

$("moreBtn")
.classList.toggle(
"on",
more
);

render();

}

function openAdd(){

if(!st()){

alert(
"ابتدا یک فروشگاه بسازید یا یک فایل فروشگاه اضافه کنید."
);

return;

}

edit=-1;

$("mtitle").textContent=
"افزودن کالا";

$("name").value="";

$("price").value="";

$("buy").value="";

$("desc").value="";

$("del").style.display=
"none";

applyMode();

$("modal").style.display=
"flex";

setTimeout(
()=>
$("name").focus(),
80
);

}

function openEdit(i){

if(!st()){

return;

}

edit=i;

let x=
st().items[i];

$("mtitle").textContent=
"ویرایش کالا";

$("name").value=
x.name||"";

$("price").value=
x.price||"";

$("buy").value=
isSeller()
?
""
:
(x.buy||"");

$("desc").value=
x.desc||"";

$("del").style.display=
"block";

applyMode();

$("modal").style.display=
"flex";

}

function closeModal(){

$("modal").style.display=
"none";

render();

}

function saveItem(){

if(!st()){

return;

}

let n=
$("name").value.trim();

let p=
$("price").value.trim();

if(!n||!p){

alert(
"نام و قیمت را وارد کن"
);

return;

}

let old=
edit>=0
?
st().items[edit]
:
null;

let itemId=
old&&old.id
?
old.id
:
makeId();

let x;

if(isSeller()){

x={
id:itemId,
name:n,
price:p,
desc:$("desc").value.trim(),
last:Date.now()
};

}else{

x={
id:itemId,
name:n,
price:p,
buy:$("buy").value.trim(),
desc:$("desc").value.trim(),
last:Date.now()
};

}

if(edit<0){

st().items.push(x);

}else{

st().items[edit]=x;

}

save();

closeModal();

}

function deleteItem(){

if(edit<0){

return;

}

let item=
st().items[edit];

if(
!confirm(
"این کالا حذف شود؟"
)
){

return;

}

st().items.splice(
edit,
1
);

save();

closeModal();

}

function safeFileName(name){

return String(name)
.replace(
/[\\/:*?"<>|]/g,
"-"
)
.trim()
||
"store";

}

function exportPriceList(){

if(!st()){

alert(
"ابتدا یک فروشگاه انتخاب کنید."
);

return;

}

ensureIds();

ensureItemIds();

save();

const packageData={
type:"priceyar-price-list",
version:2,
createdAt:Date.now(),
shareMode:isSeller()
?
"seller"
:
"management",
stores:[
JSON.parse(
JSON.stringify(st())
)
],
deleted:{}
};

const json=
JSON.stringify(
packageData,
null,
2
);

const fileName=
"لیست جدید قیمت‌ها - برای به‌روزرسانی لمس کنید.json";

if(
window.AndroidBridge&&
AndroidBridge.sharePriceList
){

try{

AndroidBridge.sharePriceList(
json,
fileName
);

return;

}catch(e){

console.log(
"Native share error:",
e
);

}

}

if(
window.AndroidBridge&&
AndroidBridge.exportPriceList
){

try{

AndroidBridge.exportPriceList(
json,
fileName
);

return;

}catch(e){

console.log(
"Native export error:",
e
);

}

}

try{

const blob=
new Blob(
[json],
{
type:
"application/json;charset=utf-8"
}
);

const a=
document.createElement("a");

const url=
URL.createObjectURL(blob);

a.href=url;

a.download=fileName;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(
()=>{
URL.revokeObjectURL(url);
},
2000
);

}catch(e){

alert(
"امکان ساخت فایل وجود ندارد."
);

}

}

function updatePriceList(){

if(
window.AndroidBridge&&
AndroidBridge.importPriceList
){

try{

AndroidBridge.importPriceList();

return;

}catch(e){

console.log(
"Native import error:",
e
);

}

}

const input=
$("updateFile");

input.value="";

input.click();

}

window.receiveImportedPriceList=
function(text){

try{

const incoming=
JSON.parse(text);

if(
!incoming||
incoming.type!=="priceyar-price-list"||
!Array.isArray(incoming.stores)
){

throw new Error("invalid");

}

let isSellerFile=false;

if(
incoming.shareMode==="seller"
){

isSellerFile=true;

}else if(
incoming.shareMode==="management"
){

isSellerFile=false;

}else{

let allItems=[];

incoming.stores.forEach(
store=>{

if(
Array.isArray(store.items)
){

allItems=
allItems.concat(
store.items
);

}

});

if(allItems.length>0){

isSellerFile=
allItems.every(
item=>
!Object.prototype.hasOwnProperty.call(
item,
"buy"
)
);

}

}

setMode(
isSellerFile
?
"seller"
:
"management"
);

if(!Array.isArray(data.stores)){

data.stores=[];

}

let updatedStores=0;

let updatedItems=0;

let addedStores=0;

let addedItems=0;

let firstImportedStore=null;

incoming.stores.forEach(
inStore=>{

if(!inStore){

return;

}

const incomingName=
String(
inStore.name||
""
).trim();

if(!incomingName){

return;

}

let localIndex=
data.stores.findIndex(
s=>
normalizeName(s.name)===
normalizeName(incomingName)
);

let localStore;

if(localIndex<0){

localStore={
id:
inStore.id||
makeId(),

name:
incomingName,

items:[]
};

data.stores.push(localStore);

localIndex=
data.stores.length-1;

addedStores++;

}else{

localStore=
data.stores[localIndex];

updatedStores++;

if(!localStore.id){

localStore.id=
inStore.id||
makeId();

}

}

if(!Array.isArray(inStore.items)){

inStore.items=[];

}

/*
فایل واردشده مرجع کامل فروشگاه است.
بنابراین تمام کالاهای قبلی این فروشگاه
با کالاهای داخل فایل جایگزین می‌شوند.
*/

const newItems=[];

inStore.items.forEach(
remoteItem=>{

if(!remoteItem){

return;

}

const remoteName=
String(
remoteItem.name||
""
).trim();

if(!remoteName){

return;

}

const oldItem=
localStore.items.find(
item=>
normalizeName(item.name)===
normalizeName(remoteName)
);

const newItem={
id:
remoteItem.id||
(oldItem&&oldItem.id)||
makeId(),

name:
remoteName,

price:
remoteItem.price||"",

desc:
remoteItem.desc||"",

last:
Number(
remoteItem.last||
Date.now()
)
};

if(!isSellerFile){

newItem.buy=
remoteItem.buy||
"";

}

newItems.push(newItem);

if(oldItem){

updatedItems++;

}else{

addedItems++;

}

});

localStore.name=
incomingName;

localStore.items=
newItems;

if(!firstImportedStore){

firstImportedStore=
localStore;

}

});

if(firstImportedStore){

const importedIndex=
data.stores.indexOf(
firstImportedStore
);

if(importedIndex>=0){

data.active=
importedIndex;

}

}

ensureIds();

ensureItemIds();

if(isSellerFile){

cleanSellerData();

}

save();

updateStoreButton();

applyMode();

const totalChanged=
updatedStores+
addedStores+
updatedItems+
addedItems;

if(totalChanged){

alert(
"لیست با موفقیت وارد شد.\n\n"+
"فروشگاه و کالاها دقیقاً مطابق فایل تنظیم شدند."
);

}else{

alert(
"لیست وارد شد و وضعیت فروشگاه مطابق فایل تنظیم شد."
);

}

}catch(error){

console.log(
"Import error:",
error
);

alert(
"فایل انتخاب‌شده معتبر نیست.\n\n"+
"لطفاً فایل لیست PriceYar را انتخاب کن."
);

}

};

window.exportFinished=
function(){

alert(
"فایل لیست قیمت با موفقیت آماده شد.\n\n"+
"حالا می‌توانی آن را برای بقیه ارسال کنی."
);

};

window.exportCancelled=
function(){};

window.exportFailed=
function(){

alert(
"ارسال یا آماده‌سازی فایل انجام نشد.\n\n"+
"لطفاً دوباره تلاش کن."
);

};

window.importFailed=
function(){

alert(
"خواندن فایل انجام نشد.\n\n"+
"لطفاً دوباره فایل را انتخاب کن."
);

};

function importPriceList(e){

const file=
e.target.files[0];

if(!file){

return;

}

const reader=
new FileReader();

reader.onload=()=>
{

window.receiveImportedPriceList(
reader.result
);

};

reader.readAsText(file);

e.target.value="";

}

$("search")
.addEventListener(
"input",
render
);

$("search")
.addEventListener(
"focus",
()=>{

setTimeout(
()=>
$("search").scrollIntoView(
{
behavior:"smooth",
block:"start"
}
),
250
);

});

$("modal")
.addEventListener(
"click",
e=>{

if(
e.target.id==="modal"
){

closeModal();

}

});

ensureIds();

ensureItemIds();

updateStoreButton();

applyMode();

/*
اطلاعات ذخیره‌شده قبلی از نسخه‌های قبل حفظ می‌شود.
اما اگر قبلاً هیچ فروشگاهی وجود نداشته باشد،
هیچ فروشگاهی خودکار ساخته نمی‌شود.
*/

if(
window.AndroidBridge&&
AndroidBridge.loadData
){

try{

const native=
AndroidBridge.loadData();

if(native){

data=
JSON.parse(native);

ensureIds();

ensureItemIds();

localStorage.setItem(
K,
JSON.stringify(data)
);

updateStoreButton();

render();

}else{

if(!data.stores.length){

data.active=-1;

}

AndroidBridge.saveData(
JSON.stringify(data)
);

}

}catch(e){

console.log(
"Native load error:",
e
);

}

}

if(!data.stores.length){

data.active=-1;

updateStoreButton();

render();

}else{

ensureIds();

ensureItemIds();

updateStoreButton();

render();

}

if(
"serviceWorker"
in navigator
){

window.addEventListener(
"load",
()=>{

navigator.serviceWorker
.register("sw.js")
.catch(()=>{});

});

}

</script>

</body>
</html>
