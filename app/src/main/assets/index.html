<style>

<body>
<main class="app">
<div class="head">
<div class="storeBox"><button class="storeBtn emptyStore" id="storeBtn"></button><div id="storeMenu" class="storeMenu"></div></div>
<div class="topTools"><button class="ledgerBtn" onclick="openLedger()"><span class="ledgerMiniLogo" aria-hidden="true"><i></i></span> دفتر حساب</button><div id="modeBadge" class="modeBadge"></div></div>
</div>
<div class="searchWrap"><span class="searchIcon">⌕</span><input id="search" class="search" autocomplete="off" placeholder="جستجوی کالا..."></div>
<div class="quickRow"><button class="add" onclick="openAdd()">＋ افزودن کالا</button><button class="more" id="moreBtn" onclick="toggleMore()">اطلاعات ○</button></div>
<div class="section"><b id="title">کالاهای اخیر</b><span id="count"></span></div>
<div id="list"></div>
<button class="back" onclick="exportPriceList()">➤ ارسال لیست</button>
<button class="back" onclick="updatePriceList()">↻ به‌روزرسانی لیست</button>
<button class="settingsBtn" onclick="openSettings()">⚙ تنظیمات</button>
<input id="updateFile" class="file" type="file" accept=".json,application/json" onchange="importPriceList(event)">
</main>

<div id="modal" class="modal"><div class="sheet"><h2 id="mtitle">افزودن کالا</h2><input id="name" class="input" placeholder="نام کالا"><input id="price" class="input" placeholder="قیمت" inputmode="numeric"><div id="buyWrap"><input id="buy" class="input" placeholder="قیمت خرید (اختیاری)" inputmode="numeric"></div><textarea id="desc" class="input textarea" placeholder="توضیحات (اختیاری)"></textarea><div class="actions"><button class="btn" onclick="saveItem()">ذخیره</button><button class="btn dark" onclick="closeModal()">انصراف</button><button id="del" class="btn danger" onclick="deleteItem()">حذف</button></div></div></div>

<div id="settingsModal" class="modal"><div class="sheet"><h2>تنظیمات</h2><div class="settingTitle">حالت نمایش</div><div class="settingRow"><button id="darkOption" class="settingOption" onclick="setTheme('dark')">تیره</button><button id="lightOption" class="settingOption" onclick="setTheme('light')">روشن</button></div><div class="settingTitle">رنگ قیمت‌ها</div><div class="settingRow"><button class="settingOption colorOption colorWhite" onclick="setPriceColor('#fff')">سفید</button><button class="settingOption colorOption colorBlue" onclick="setPriceColor('#64B4FF')">آبی</button><button class="settingOption colorOption colorGreen" onclick="setPriceColor('#55d98b')">سبز</button><button class="settingOption colorOption colorYellow" onclick="setPriceColor('#ffd75a')">زرد</button><button class="settingOption colorOption colorRed" onclick="setPriceColor('#ff6b6b')">قرمز</button></div><div class="settingTitle">نمایش اعداد</div><div class="settingRow"><button id="faDigitsOption" class="settingOption" onclick="setDigits('fa')">فارسی</button><button id="enDigitsOption" class="settingOption" onclick="setDigits('en')">لاتین</button></div><button class="settingsClose" onclick="closeSettings()">بستن</button></div></div>

<div id="ledgerModal" class="modal"><div class="sheet ledgerSheet sheetScrollFix"><div class="ledgerHeader"><h2><span class="ledgerMiniLogo" aria-hidden="true"><i></i></span> دفتر حساب</h2><button id="ledgerAddBtn" class="ledgerAdd" onclick="openAccountForm()">＋ حساب جدید</button></div><div class="ledgerTabs"><button id="creditorTab" class="ledgerTab creditor active" onclick="setLedgerTab('creditor')">طلب</button><button id="debtorTab" class="ledgerTab debtor" onclick="setLedgerTab('debtor')">بدهی</button></div><input id="ledgerSearch" class="ledgerSearch" autocomplete="off" placeholder="جستجوی حساب..." oninput="renderAccounts()"><div id="ledgerTotal" class="ledgerTotal"><span id="ledgerTotalTitle">جمع کل طلب‌ها</span><span id="ledgerTotalValue" class="totalValue credit">۰</span></div><div id="accountList"></div></div></div>

<div id="accountModal" class="modal"><div class="sheet sheetScrollFix"><div class="ledgerHeader"><h2 id="accountTitle">حساب</h2></div><div id="accountContent"></div></div></div>
<div id="accountActionModal" class="modal"><div class="sheet actionPopup"><h2 id="accountActionTitle">عملیات حساب</h2><button class="popupAction" onclick="accountAction('detail')">مشاهده ثبت‌ها</button><button class="popupAction" onclick="accountAction('tx')">＋ ثبت مبلغ</button><button id="accountPaymentAction" class="popupAction paymentAction" onclick="accountAction('payment')">＋ پرداختی</button><button class="popupAction" onclick="accountAction('edit')">ویرایش حساب</button><button class="popupAction danger" onclick="accountAction('delete')">حذف حساب</button><button class="popupCancel" onclick="closeAccountAction()">انصراف</button></div></div>
<div id="deleteItemModal" class="modal"><div class="sheet actionPopup"><h2>حذف</h2><div class="popupText">آیا این کالا حذف شود؟</div><button class="popupAction danger" onclick="confirmDeleteItem()">حذف</button><button class="popupCancel" onclick="closeDeleteItemPopup()">انصراف</button></div></div>

<div id="accountFormModal" class="modal"><div class="sheet sheetScrollFix"><h2 id="accountFormTitle">حساب جدید</h2><div class="settingTitle">نوع حساب</div><div class="settingRow"><button id="accountCreditorBtn" class="settingOption" onclick="setAccountType('creditor')">طلب</button><button id="accountDebtorBtn" class="settingOption" onclick="setAccountType('debtor')">بدهی</button></div><input id="accountName" class="input" placeholder="نام شخص / شرکت"><input id="accountPhone" class="input" placeholder="شماره تماس (اختیاری)" inputmode="tel"><textarea id="accountNote" class="input textarea" placeholder="توضیحات (اختیاری)"></textarea><div class="actions formSave"><button class="btn" onclick="saveAccount()">ذخیره</button><button class="btn dark" onclick="closeAccountForm()">انصراف</button></div></div></div>

<div id="txModal" class="modal"><div class="sheet sheetScrollFix"><h2 id="txTitle">ثبت مبلغ</h2><div class="settingTitle">تاریخ شمسی</div><input id="txDate" class="input" placeholder="۱۴۰۵/۰۷/۱۳" inputmode="numeric" maxlength="10"><button class="smallBtn" style="width:100%;margin:4px 0 8px" onclick="setTodayTxDate()">امروز</button><input id="txAmount" class="input amountInput" placeholder="۱,۲۵۰,۰۰۰" inputmode="numeric"><textarea id="txNote" class="input textarea" placeholder="شرح (اختیاری)"></textarea><div class="actions formSave"><button class="btn" onclick="saveTransaction()">ذخیره</button><button class="btn dark" onclick="closeTx()">انصراف</button></div><div id="txDeleteWrap" style="display:none;margin-top:10px"><button class="btn danger" style="width:100%" onclick="deleteCurrentTransaction()">حذف ثبت</button></div></div></div>


<script>
const K="priceYarStoresV3",MODE_KEY="priceYarAppMode",SETTINGS_KEY="priceYarSettingsV1",LEDGER_KEY="priceYarLedgerV1";
let data=JSON.parse(localStorage.getItem(K)||"null")||{active:-1,stores:[],deleted:{}};
let appMode=localStorage.getItem(MODE_KEY)||"management";
let settings=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"null")||{theme:"dark",priceColor:"#fff",digits:"fa"};
let ledger=JSON.parse(localStorage.getItem(LEDGER_KEY)||"null")||{accounts:[]};
let edit=-1,more=false,accountEdit=-1,activeAccount=-1,txEdit=-1,txType="debit";

function jalaliToday(){return formatJalali(new Date())}

function formatJalali(d){let gy=d.getFullYear(),gm=d.getMonth(),gd=d.getDate(),gdm=[31,28,31,30,31,30,31,31,30,31,30,31],gy2=gy-1600,gd2=gd-1,leap=(gy%4===0&&gy%100!==0)||gy%400===0,gdn=365*gy2+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400);for(let i=0;i<gm;i++)gdn+=gdm[i];if(gm>1&&leap)gdn++;gdn+=gd2;let jdn=gdn-79,jnp=Math.floor(jdn/12053);jdn%=12053;let jy=979+33*jnp+4*Math.floor(jdn/1461);jdn%=1461;if(jdn>=366){jy+=Math.floor((jdn-1)/365);jdn=(jdn-1)%365}let jm=jdn<186?1+Math.floor(jdn/31):7+Math.floor((jdn-186)/30),jd=1+(jdn<186?jdn%31:(jdn-186)%30);return String(jy).padStart(4,"0")+"/"+String(jm).padStart(2,"0")+"/"+String(jd).padStart(2,"0")}

function dateKey(v){let s=normalizeDigits(v).replace(/-/g,"/");let p=s.split("/").map(Number);if(p.length===3&&p.every(Number.isFinite))return p[0]*10000+p[1]*100+p[2];return 0}

function closeTx(){if($("txModal").style.display!=="none"){$("txModal").style.display="none"}}

function setTodayTxDate(){$("txDate").value=faDigits(jalaliToday())}

function saveTransaction(){if(isSeller()||activeAccount<0)return;let amount=formatAmount($("txAmount").value),date=normalizeDigits($("txDate").value).trim().replace(/-/g,"/").replace(/\s/g,"");let m=date.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(!amount){alert("مبلغ را وارد کن");return}if(!m){alert("تاریخ را به شکل ۱۴۰۵/۰۷/۱۳ وارد کن");return}let jy=Number(m[1]),jm=Number(m[2]),jd=Number(m[3]);if(jm<1||jm>12||jd<1||jd>31){alert("تاریخ واردشده معتبر نیست. فرمت درست: ۱۴۰۵/۰۷/۱۳");return}let a=ledger.accounts[activeAccount];if(txType==="payment"&&a.type!=="debtor"){alert("پرداختی فقط برای حساب‌های بدهی ثبت می‌شود.");return}date=String(jy).padStart(4,"0")+"/"+String(jm).padStart(2,"0")+"/"+String(jd).padStart(2,"0");let t=txEdit<0?{id:makeId()}:a.transactions[txEdit];t.amount=amount;t.date=date;t.note=$("txNote").value.trim();t.type=txType==="payment"?"payment":"debit";if(txEdit<0)a.transactions.push(t);saveLedger();history.replaceState({priceyarLayer:"account"},"");closeTx();renderAccount();renderAccounts()}

function deleteCurrentTransaction(){if(isSeller()||activeAccount<0||txEdit<0)return;if(!confirm("این ثبت حذف شود؟"))return;let a=ledger.accounts[activeAccount];if(!a.transactions[txEdit])return;a.transactions.splice(txEdit,1);saveLedger();history.replaceState({priceyarLayer:"account"},"");closeTx();renderAccount();renderAccounts()}

function deleteTransaction(i){if(isSeller()||activeAccount<0||!confirm("این ثبت حذف شود؟"))return;ledger.accounts[activeAccount].transactions.splice(i,1);saveLedger();renderAccount();renderAccounts()}

["modal","settingsModal","accountActionModal","deleteItemModal"].forEach(id=>$(id).addEventListener("click",e=>{if(e.target.id!==id)return;if(id==="modal")closeModal();else if(id==="settingsModal")closeSettings();else if(id==="accountActionModal")closeAccountAction();else closeDeleteItemPopup()}));
$("search").addEventListener("input",render);
$("ledgerSearch").addEventListener("input",renderAccounts);
["price","buy","txAmount"].forEach(id=>$(id).addEventListener("input",e=>{e.target.value=formatInputAmount(e.target.value)}));
function formatJalaliInput(v){let raw=normalizeDigits(v).replace(/\D/g,"").slice(0,8);if(raw.length>6)raw=raw.slice(0,4)+"/"+raw.slice(4,6)+"/"+raw.slice(6);else if(raw.length>4)raw=raw.slice(0,4)+"/"+raw.slice(4);return faDigits(raw)}
$("txDate").addEventListener("input",e=>{e.target.value=formatJalaliInput(e.target.value)});
function handleBackLayer(){
if($("deleteItemModal").style.display!=="none"){closeDeleteItemPopup();return true}
if($("accountActionModal").style.display!=="none"){closeAccountAction();return true}
if($("txModal").style.display!=="none"){closeTx();return true}
if($("accountFormModal").style.display!=="none"){closeAccountForm();return true}
if($("accountModal").style.display!=="none"){closeAccount();return true}
if($("ledgerModal").style.display!=="none"){closeLedger();return true}
if($("settingsModal").style.display!=="none"){closeSettings();return true}
if($("modal").style.display!=="none"){closeModal();return true}
return true;
}
window.handleAndroidBack=handleBackLayer;
window.addEventListener("popstate",()=>{handleBackLayer()});
if(!history.state?.priceyarBase)history.replaceState({priceyarBase:true},"");ensureIds();ensureItemIds();ensureLedger();updateStoreButton();applyMode();
if(AndroidBridge?.loadData)try{let n=AndroidBridge.loadData();if(n){data=JSON.parse(n);ensureIds();ensureItemIds();localStorage.setItem(K,JSON.stringify(data))}else AndroidBridge.saveData(JSON.stringify(data))}catch(e){}
updateStoreButton();render();
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

</script>
