name: Build PriceYar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --stacktrace --info > build-error.txt 2>&1
          RESULT=$?
          cat build-error.txt
          echo "BUILD_RESULT=$RESULT"
          exit $RESULT

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PriceYar-build-log
          path: build-error.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PriceYar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
